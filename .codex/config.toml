# The model and reasoning effort come from forge.toml and the session's own
# choice; only Plan mode keeps its own effort setting below.
plan_mode_reasoning_effort = "high"
# Terse output: artifacts and diffs carry the substance, not prose.
model_verbosity = "low"
model_reasoning_summary = "concise"
personality = "pragmatic"
# Full access by owner decision (2026-10-01); Forge's deny hook still blocks
# destructive commands.
sandbox_mode = "danger-full-access"
approval_policy = "never"
web_search = "cached"

# The commands the worker runs may reach the network: the
# package registry and the local database, so a task can install what it
# declares and run the tests it writes. Writes stay confined to the worktree.
# On Windows this is what routes each command to the CodexSandboxOnline
# account; the offline account cannot reach even 127.0.0.1.
[sandbox_workspace_write]
network_access = true

[features]
hooks = true
codex_hooks = true
multi_agent = true
streamable_shell = true
skills = true

[agents]
max_threads = 6
max_depth = 1

[projects."/workspace"]
trust_level = "trusted"
