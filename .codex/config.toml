# Implementation default: the GPT-5.6 flagship at medium effort — bounded
# tasks with approved plans rarely need more; escalate effort to high for
# migrations/cross-domain/concurrency/security-sensitive work.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
# Terse output: artifacts and diffs carry the substance, not prose.
model_verbosity = "low"
model_reasoning_summary = "concise"
personality = "pragmatic"
# Workspace-write by default. Needing broader access means editing this value
# deliberately, as a diff-visible change.
sandbox_mode = "workspace-write"
web_search = "cached"

# The commands the worker runs may reach the network: the
# package registry and the local database, so a task can install what it
# declares and run the tests it writes. Writes stay confined to the worktree.
# On Windows this is what routes each command to the CodexSandboxOnline
# account; the offline account cannot reach even 127.0.0.1.
[sandbox_workspace_write]
network_access = true

[features]
hooks = true
codex_hooks = true
multi_agent = true
streamable_shell = true
skills = true

[agents]
max_threads = 6
max_depth = 1

[projects."/workspace"]
trust_level = "trusted"
