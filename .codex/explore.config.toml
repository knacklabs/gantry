# NOTE: codex resolves overlay profiles from $CODEX_HOME — run with
# CODEX_HOME=$PWD/.codex (or copy this file to ~/.codex/) for the profile
# to be found.
# Exploration profile for CODEX-NATIVE sessions: `codex --profile explore`
# (gpt-5.6-sol @ low, read-only). From Claude the path is /codex:rescue
# --model gpt-5.6-sol --effort low; raw codex exec is hook-blocked.
# Planning-phase codebase exploration is NEVER done by Claude Code itself
# (role split, harness.yaml): it runs on Sol at low effort. Overlays
# config.toml; only the differing keys live here.
model = "gpt-5.6-sol"
model_reasoning_effort = "low"
sandbox_mode = "read-only"
