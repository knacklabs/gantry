name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_logs:
        description: 'Enable verbose test logs (no LOG_LEVEL suppression)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-trixie
        env:
          POSTGRES_DB: gantry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gantry_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci

      # Static checks run first because they need nothing but `npm ci`, and they
      # are the cheapest signal in the job. Everything below — Postgres bootstrap,
      # SBOM, the ~4 minute image build — is wasted work when formatting, an
      # architecture budget, or a type error is already broken.
      #
      # Format check and Architecture check stay adjacent because together they
      # mirror verify.py's `structural` phase (format:check && check:architecture).
      # Without the architecture step a PR can merge green while leaving main
      # failing that gate, and because verify.py aborts at its first failing phase,
      # one over-budget file then masks typecheck and tests for every branch.
      - name: Format check
        run: npm run format:check

      - name: Architecture check
        run: npm run check:architecture

      - name: Documentation check
        run: npm run docs:check

      - name: Drizzle migration check
        run: |
          npm run db:migrations:check
          npm run db:migrations:generate -- --name ci_schema_drift
          test -z "$(git status --porcelain -- apps/core/src/adapters/storage/postgres/schema/migrations)"

      - name: Typecheck
        run: npm run typecheck

      - name: Web format check
        run: npm run format:check:web

      - name: Web typecheck
        run: npm run typecheck:web

      - name: Web lint
        run: npm run lint:web

      - name: Web build
        run: npm run build:web

      - name: Bootstrap Postgres test DB
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d gantry_test -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Apply migrations to clean Postgres schema
        env:
          GANTRY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/gantry_test
        run: npm run test:integration:postgres -- apps/core/test/integration/postgres-migration-chain.postgres.integration.test.ts

      - name: Generate runtime SBOM
        run: npm run --silent security:sbom > gantry-runtime-sbom.cdx.json

      - name: Upload runtime SBOM
        uses: actions/upload-artifact@v4
        with:
          name: gantry-runtime-sbom
          path: gantry-runtime-sbom.cdx.json

      - name: Build runtime image
        # The self-hosted runner has docker + buildx but no compose plugin
        # (neither v2 `docker compose` nor v1 `docker-compose`). Build the same
        # runtime image the fleet compose file defines directly — identical
        # Dockerfile, context, and tag (gantry-runtime:fleet-rehearsal) — so the
        # `security:images --inspect-compose-images` step below still finds it.
        run: docker build --pull -f ops/docker/Dockerfile -t gantry-runtime:fleet-rehearsal .

      - name: Check runtime images
        run: npm run security:images -- --inspect-compose-images --require-content-inspection

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm run security:package

      - name: Tests
        id: tests
        run: |
          set -o pipefail
          : > /tmp/vitest.log

          run_check() {
            echo "Running $*" | tee -a /tmp/vitest.log
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.debug_logs }}" = "true" ]; then
              timeout 900s env CI=true "$@" 2>&1 | tee -a /tmp/vitest.log
            else
              timeout 900s env LOG_LEVEL=fatal CI=true "$@" 2>&1 | tee -a /tmp/vitest.log
            fi
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 124 ]; then
              echo "::error::$* timed out after 900 seconds"
              exit 124
            fi
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          }

          # Unit + integration only. The e2e lanes run nightly
          # (.github/workflows/nightly-e2e.yml): they boot a runtime, drive real
          # transports and call a rate-limited real model, so per-PR they cost
          # every author ~10 minutes and fail for reasons unrelated to the diff.
          run_check npm test
          export GANTRY_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/gantry_test
          run_check npm run test:integration:postgres
          run_check npm run test:integration:postgres:chaos

      - name: Debug CI Hang Context
        if: ${{ always() && steps.tests.outcome != 'success' }}
        run: |
          {
            echo "=== Date ==="
            date -u
            echo
            echo "=== Process Snapshot ==="
            ps -eo pid,ppid,etime,stat,cmd | grep -E 'vitest|node|npm' | grep -v grep || true
            echo
            echo "=== Open Files for Node Processes ==="
            pgrep -f 'node|vitest|npm' | while read -r pid; do
              echo "--- PID $pid ---"
              lsof -p "$pid" | head -n 120 || true
            done
            echo
            echo "=== Last 300 lines of /tmp/vitest.log ==="
            tail -n 300 /tmp/vitest.log || true
          } | tee /tmp/ci-debug.txt

      - name: Upload CI Debug Artifacts
        if: ${{ always() && steps.tests.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-logs
          path: |
            /tmp/vitest.log
            /tmp/ci-debug.txt
          if-no-files-found: ignore
