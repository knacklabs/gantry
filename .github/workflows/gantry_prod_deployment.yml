name: Gantry Prod Deployment

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      postgres_pool_max:
        description: Gantry Postgres pool size for this deployment
        required: false
        default: '12'
        type: string
      pgboss_pool_max:
        description: Gantry pg-boss pool size for this deployment
        required: false
        default: '1'
        type: string
      backend_smoke_only:
        description: Test the deployed ATS-to-Gantry source-sync path without deploying
        required: false
        default: false
        type: boolean
      handoff_only:
        description: Complete an existing Gantry revision using the dev-style single-task handoff
        required: false
        default: false
        type: boolean
  push:
    branches:
      - develop

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: kl-aws-aps1-prod-ecs-ats-cluster
  ECR_REPOSITORY: kl-aws-aps1-prod-ecr-ats-gantry-reagent
  ECS_SERVICE: kl-aws-aps1-prod-ecs-ats-gantry-reagent-service
  TASK_NAME: kl-aws-aps1-prod-task_definition-ats-gantry-reagent
  CONTAINER_NAME: kl-aws-aps1-prod-task_definition-ats-gantry-reagent-container
  HEALTH_CHECK_START_PERIOD_SECONDS: 240
  POSTGRES_POOL_MAX: ${{ inputs.postgres_pool_max || '12' }}
  PGBOSS_POOL_MAX: ${{ inputs.pgboss_pool_max || '1' }}
  PRIVATE_SERVICE_URL_KEYS: ATS_INTERNAL_API_URL

jobs:
  deploy:
    if: ${{ !inputs.backend_smoke_only && !inputs.handoff_only }}
    name: Deploy to gantry-reagent Prod
    runs-on: self-hosted
    environment: ATS Prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f ops/docker/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: aws ecs describe-task-definition --task-definition ${{ env.TASK_NAME }} --query taskDefinition > task-definition.json

      - name: Update validated Gantry database pool settings
        run: |
          # Production is intentionally capped at six application connections;
          # accept only the approved 6-12 range and keep pg-boss tightly bounded.
          [[ "$POSTGRES_POOL_MAX" =~ ^[6-9]$|^1[0-2]$ ]]
          [[ "$PGBOSS_POOL_MAX" =~ ^[1-2]$ ]]
          aws ssm put-parameter \
            --name GANTRY_POSTGRES_POOL_MAX \
            --type String \
            --value "$POSTGRES_POOL_MAX" \
            --overwrite
          aws ssm put-parameter \
            --name GANTRY_PGBOSS_POOL_MAX \
            --type String \
            --value "$PGBOSS_POOL_MAX" \
            --overwrite

      - name: Configure production runtime safety settings
        run: |
          test "$(jq --arg container "$CONTAINER_NAME" '[.containerDefinitions[] | select(.name == $container)] | length' task-definition.json)" -eq 1
          jq \
            --arg container "$CONTAINER_NAME" \
            --argjson startPeriod "$HEALTH_CHECK_START_PERIOD_SECONDS" \
            --arg privateServiceUrlKeys "$PRIVATE_SERVICE_URL_KEYS" \
            '(.containerDefinitions[] | select(.name == $container) | .healthCheck.startPeriod) = $startPeriod |
             (.containerDefinitions[] | select(.name == $container) | .environment) |=
               ((. // []) | map(select(.name != "GANTRY_DETERMINISTIC_PRIVATE_SERVICE_URL_KEYS")) + [{
                 name: "GANTRY_DETERMINISTIC_PRIVATE_SERVICE_URL_KEYS",
                 value: $privateServiceUrlKeys
               }])' \
            task-definition.json > task-definition.patched.json
          mv task-definition.patched.json task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
          wait-for-minutes: 30

  handoff:
    if: ${{ inputs.handoff_only }}
    name: Complete Gantry single-task handoff
    runs-on: self-hosted
    environment: ATS Prod

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply dev-style single-task deployment
        run: |
          set -euo pipefail
          test "$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)" = "1"

          target_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          test -n "$target_task_definition"

          # Match dev's single-task handoff while retaining production AZ
          # rebalancing, which requires maximumPercent to be greater than 100.
          # At desiredCount=1, ECS rounds 101% down to one running task.
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$target_task_definition" \
            --deployment-configuration minimumHealthyPercent=0,maximumPercent=101 \
            --force-new-deployment \
            >/dev/null
          for attempt in $(seq 1 80); do
            service_state="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].[runningCount,pendingCount,length(deployments),deployments[0].rolloutState]' \
              --output text)"
            echo "gantry_handoff $service_state"
            if [ "$service_state" = $'1\t0\t1\tCOMPLETED' ]; then
              break
            fi
            if [ "$attempt" -eq 80 ]; then
              echo "Gantry did not stabilize within 20 minutes" >&2
              exit 1
            fi
            sleep 15
          done

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition,deploymentConfiguration:deploymentConfiguration}' \
            --output json
          test "$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].runningCount' \
            --output text)" = "1"

  backend-smoke:
    if: ${{ inputs.backend_smoke_only && !inputs.handoff_only }}
    name: Test ATS to Gantry source sync
    runs-on: self-hosted
    environment: ATS Prod

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Session Manager plugin
        run: |
          if command -v session-manager-plugin >/dev/null 2>&1; then
            session-manager-plugin --version
          else
            curl --fail --silent --show-error --location \
              --output "$RUNNER_TEMP/session-manager-plugin.deb" \
              https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
            plugin_root="$RUNNER_TEMP/session-manager-plugin"
            dpkg-deb --extract "$RUNNER_TEMP/session-manager-plugin.deb" "$plugin_root"
            plugin_dir="$plugin_root/usr/local/sessionmanagerplugin/bin"
            test -x "$plugin_dir/session-manager-plugin"
            echo "$plugin_dir" >> "$GITHUB_PATH"
            "$plugin_dir/session-manager-plugin" --version
          fi

      - name: Check Gantry health and trigger source sync from ATS
        env:
          ATS_SERVICE: kl-aws-aps1-prod-ecs-ats-frontend-mcp-service
          ATS_CONTAINER: kl-aws-aps1-prod-task_definition-ats-frontend-mcp-container
        run: |
          task_arn="$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ATS_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)"
          test -n "$task_arn"
          test "$task_arn" != "None"

          if aws ecs execute-command \
            --cluster "$ECS_CLUSTER" \
            --task "$task_arn" \
            --container "$ATS_CONTAINER" \
            --interactive \
            --command "node -e 'const base=process.env.GANTRY_CONTROL_URL?.replace(/\\/+$/,\"\"); const key=process.env.GANTRY_CONTROL_API_KEY; const job=process.env.GANTRY_SOURCE_SYNC_JOB_ID; if(!base||!key||!job) throw new Error(\"ATS Gantry configuration is incomplete\"); (async()=>{const health=await fetch(base+\"/healthz\",{signal:AbortSignal.timeout(10000)}); console.log(\"gantry_health\",health.status); if(!health.ok) process.exit(2); const response=await fetch(base+\"/v1/jobs/\"+encodeURIComponent(job)+\"/trigger\",{method:\"POST\",headers:{authorization:\"Bearer \"+key,\"content-type\":\"application/json\"},body:JSON.stringify({source:\"caw-ats-backend-smoke\"}),signal:AbortSignal.timeout(30000)}); const body=await response.text(); console.log(\"gantry_trigger\",response.status,body.slice(0,1000)); if(response.status!==202&&response.status!==409) process.exit(3)})().catch(error=>{console.error(error.name,error.message);process.exit(1)})'"; then
            exit 0
          fi

          echo "ATS ECS Exec is unavailable; testing the same control endpoint locally inside Gantry."
          gantry_task_arn="$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)"
          test -n "$gantry_task_arn"
          test "$gantry_task_arn" != "None"
          source_sync_job_id="$(aws ssm get-parameter \
            --name GANTRY_SOURCE_SYNC_JOB_ID \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"
          test -n "$source_sync_job_id"
          gantry_task_definition="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$gantry_task_arn" \
            --query 'tasks[0].taskDefinitionArn' \
            --output text)"
          ats_internal_parameter="$(aws ecs describe-task-definition \
            --task-definition "$gantry_task_definition" \
            --query 'taskDefinition.containerDefinitions[?name==`'"$CONTAINER_NAME"'`].secrets[] | [?name==`ATS_INTERNAL_API_URL`].valueFrom | [0]' \
            --output text)"
          test -n "$ats_internal_parameter"
          test "$ats_internal_parameter" != "None"
          ats_internal_url="$(aws ssm get-parameter \
            --name "$ats_internal_parameter" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"
          case "$ats_internal_url" in
            http://frontend-mcp-service.ats-prod:3000 | http://frontend-mcp-service.ats-prod:3000/*) ;;
            *) exit 1 ;;
          esac
          unset ats_internal_url
          echo "ATS internal authority matches the reviewed production service."

          if aws ecs execute-command \
            --cluster "$ECS_CLUSTER" \
            --task "$gantry_task_arn" \
            --container "$CONTAINER_NAME" \
            --interactive \
            --command "node -e 'const entries=JSON.parse(process.env.GANTRY_CONTROL_API_KEYS_JSON||\"[]\"); const entry=entries.find(item=>item.kid===\"ats-source-sync-prod\"&&item.scopes?.includes(\"jobs:write\")); const key=entry?.token; const job=\"$source_sync_job_id\"; if(!key||!job) throw new Error(\"Gantry ATS control configuration is incomplete\"); (async()=>{const base=\"http://127.0.0.1:8080\"; const health=await fetch(base+\"/healthz\",{signal:AbortSignal.timeout(10000)}); console.log(\"gantry_health\",health.status); if(!health.ok) process.exit(2); const response=await fetch(base+\"/v1/jobs/\"+encodeURIComponent(job)+\"/trigger\",{method:\"POST\",headers:{authorization:\"Bearer \"+key,\"content-type\":\"application/json\"},body:JSON.stringify({source:\"caw-ats-backend-smoke\"}),signal:AbortSignal.timeout(30000)}); const body=await response.text(); console.log(\"gantry_trigger\",response.status,body.slice(0,1000)); if(response.status!==202&&response.status!==409) process.exit(3)})().catch(error=>{console.error(error.name,error.message);process.exit(1)})'"; then
            exit 0
          fi

          echo "Gantry ECS Exec is unavailable; testing through the protected SSM bastion."
          eni_id="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$gantry_task_arn" \
            --query 'tasks[0].attachments[].details[] | [?name==`networkInterfaceId`].value | [0]' \
            --output text)"
          private_ip="$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$eni_id" \
            --query 'NetworkInterfaces[0].PrivateIpAddress' \
            --output text)"
          control_key="$(aws ssm get-parameter \
            --name GANTRY_CONTROL_API_KEY \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"
          test -n "$private_ip"
          test -n "$control_key"
          auth_config="$RUNNER_TEMP/gantry-auth.conf"
          tunnel_log="$RUNNER_TEMP/gantry-ssm-tunnel.log"
          umask 077
          printf 'header = "authorization: Bearer %s"\n' "$control_key" > "$auth_config"
          unset control_key
          aws ssm start-session \
            --target i-0f3181ac8bee11c86 \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"$private_ip\"],\"portNumber\":[\"8080\"],\"localPortNumber\":[\"18084\"]}" \
            >"$tunnel_log" 2>&1 &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true; wait "$tunnel_pid" 2>/dev/null || true; rm -f "$auth_config" "$tunnel_log"' EXIT
          base_url="http://127.0.0.1:18084"
          for attempt in $(seq 1 20); do
            if curl --silent --show-error --connect-timeout 1 --max-time 2 \
              --output /dev/null "$base_url/healthz"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "SSM tunnel did not become ready" >&2
              tail --lines 20 "$tunnel_log" >&2
              exit 1
            fi
            sleep 1
          done
          health_status="$(curl --silent --show-error \
            --connect-timeout 5 \
            --max-time 10 \
            --output "$RUNNER_TEMP/gantry-health.txt" \
            --write-out '%{http_code}' \
            "$base_url/healthz")"
          echo "gantry_health $health_status"
          test "$health_status" = "200"

          trigger_status="$(curl --silent --show-error \
            --connect-timeout 5 \
            --max-time 30 \
            --request POST \
            --config "$auth_config" \
            --header 'content-type: application/json' \
            --data '{"source":"caw-ats-backend-smoke"}' \
            --output "$RUNNER_TEMP/gantry-trigger.txt" \
            --write-out '%{http_code}' \
            "$base_url/v1/jobs/$source_sync_job_id/trigger")"
          echo "gantry_trigger $trigger_status"
          head --bytes 1000 "$RUNNER_TEMP/gantry-trigger.txt"
          echo
          test "$trigger_status" = "202" -o "$trigger_status" = "409"
