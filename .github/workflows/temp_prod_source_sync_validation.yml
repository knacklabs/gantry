name: Temporary Prod Source Sync Validation

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - fix/prod-managed-browser-runtime
    paths:
      - .github/workflows/temp_prod_source_sync_validation.yml

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: kl-aws-aps1-prod-ecs-ats-cluster
  ECS_SERVICE: kl-aws-aps1-prod-ecs-ats-gantry-reagent-service
  ECS_CONTAINER: kl-aws-aps1-prod-task_definition-ats-gantry-reagent-container
  JOB_ID: 4d6432d6-c76e-4ce0-8597-f66da8c68453

jobs:
  validate:
    name: Trigger one existing ATS source-sync job
    runs-on: self-hosted
    environment: ATS Prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate the new healthy production task
        shell: bash
        run: |
          set -euo pipefail
          service_state="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].[desiredCount,runningCount,pendingCount,status]' \
            --output text)"
          test "$service_state" = $'1\t1\t0\tACTIVE'

          task_arn="$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)"
          test -n "$task_arn"
          test "$task_arn" != "None"
          task_description="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$task_arn" \
            --output json)"
          task_state="$(jq -r '.tasks[0] | [.lastStatus,.healthStatus,(.enableExecuteCommand|tostring),.taskDefinitionArn] | @tsv' <<<"$task_description")"
          [[ "$task_state" == $'RUNNING\tHEALTHY\ttrue\t'*':29' ]]
          task_ip="$(jq -er '.tasks[0].attachments[] | select(.type == "ElasticNetworkInterface") | .details[] | select(.name == "privateIPv4Address") | .value' <<<"$task_description")"
          echo "GANTRY_TASK_IP=$task_ip" >> "$GITHUB_ENV"

      - name: Trigger one backend validation run
        shell: bash
        run: |
          set -euo pipefail
          control_keys="$(aws ssm get-parameter \
            --name GANTRY_CONTROL_API_KEYS_JSON \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"
          control_token="$(jq -er '.[] | select(.kid == "ats-source-sync-prod") | .token' <<<"$control_keys")"
          echo "::add-mask::$control_token"
          response="$(curl --noproxy '*' --connect-timeout 10 --max-time 20 -fsS \
            -X POST \
            -H "Authorization: Bearer $control_token" \
            -H 'Accept: application/json' \
            "http://$GANTRY_TASK_IP:8080/v1/jobs/$JOB_ID/trigger")"
          jq -e '.triggerId | strings | length > 0' <<<"$response" >/dev/null
          echo "Existing ATS source-sync job queued successfully."
