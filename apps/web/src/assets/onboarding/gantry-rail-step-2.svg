<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 57 57" aria-hidden="true">
  <style>@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}@keyframes current{0%,100%{opacity:.45}50%{opacity:1}}.muted{fill:#3b3833;opacity:.4}.done{fill:#84a87e;transform-box:fill-box;transform-origin:center;animation:pop .3s cubic-bezier(.2,.7,.2,1)}.current{fill:#f0eeea;animation:current 1.9s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.done,.current{animation:none}}</style>
  <rect class="muted" width="17" height="17" x="0" y="0" rx="3"/><rect class="muted" width="17" height="17" x="20" y="0" rx="3"/><rect class="done" width="17" height="17" x="40" y="0" rx="3"/><rect class="muted" width="17" height="17" x="0" y="20" rx="3"/><rect class="current" width="17" height="17" x="20" y="20" rx="3"/><rect class="muted" width="17" height="17" x="40" y="20" rx="3"/><rect class="muted" width="17" height="17" x="0" y="40" rx="3"/><rect class="muted" width="17" height="17" x="20" y="40" rx="3"/><rect class="muted" width="17" height="17" x="40" y="40" rx="3"/>
</svg>
