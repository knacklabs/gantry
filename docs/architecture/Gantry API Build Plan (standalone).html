  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ar(--mute); margin: 0 0 8px; }\n  p { font-size: 14.5px; color: var(--ink2); margin: 0 0 12px; text-wrap: pretty; }\n  a { color: var(--accent); }\n  strong { color: var(--ink); font-weight: 600; }\n  .lede { font-size: 17px; color: var(--ink2); line-height: 1.55; }\n\n  .meta { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--mute); }\n  .meta .mono { color: var(--ink2); font-weight: 600; }\n\n  section { margin-top: 48px; }\n  .secnum { font-family: 'Spline Sans Mono', monospace; font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .1em; display: block; margin-bottom: 6px; }\n  .sechead { padding-bottom: 12px; border-bottom: 2px solid var(--ink); margin-bottom: 22px; }\n\n  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 14px 0; }\n  .card.new { border-color: var(--new); background: linear-gradient(0deg, var(--paper), var(--paper)); }\n  .card.exist { border-style: dashed; }\n\n  .pillrow { display: flex; gap: 7px; flex-wrap: wrap; margin: 4px 0 14px; }\n  .pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--line2); background: var(--fill); color: var(--ink2); white-space: nowrap; }\n  .pill.have { background: var(--ok-soft); border-color: var(--ok); color: #34522f; }\n  .pill.gap { background: var(--alert-soft); border-color: var(--alert); color: #8a4029; }\n  .pill.partial { background: var(--accent-soft); border-color: var(--accent); color: #7a5212; }\n  .pill.new { background: var(--new-soft); border-color: var(--new); color: #1f5772; }\n\n  .ep { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }\n  .ep:last-child { border-bottom: none; }\n  .verb { font-family: 'Spline Sans Mono', monospace; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 5px; text-align: center; align-self: start; }\n  .verb.get { background: var(--new-soft); color: #1f5772; }\n  .verb.post { background: var(--ok-soft); color: #34522f; }\n  .verb.patch { background: var(--accent-soft); color: #7a5212; }\n  .verb.del { background: var(--alert-soft); color: #8a4029; }\n  .ep .path { font-family: 'Spline Sans Mono', monospace; font-size: 12.5px; color: var(--ink); font-weight: 600; }\n  .ep .desc { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }\n\n  ul { margin: 4px 0 14px; padding-left: 0; list-style: none; }\n  li { font-size: 14px; color: var(--ink2); padding: 4px 0 4px 22px; position: relative; }\n  li::before { content: ''; position: absolute; left: 4px; top: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }\n  li strong { color: var(--ink); }\n\n  .kvtable { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-size: 13px; }\n  .kvtable th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); font-weight: 600; padding: 7px 10px; border-bottom: 1.5px solid var(--ink); }\n  .kvtable td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink2); }\n  .kvtable td.mono { font-family: 'Spline Sans Mono', monospace; font-size: 11.5px; color: var(--ink); font-weight: 600; white-space: nowrap; }\n  .kvtable tr:last-child td { border-bottom: none; }\n\n  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n  .note { font-size: 12.5px; color: var(--mute); font-style: italic; margin-top: 6px; }\n  .tag { font-family: 'Spline Sans Mono', monospace; font-size: 11px; background: var(--fill); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 6px; color: var(--ink); white-space: nowrap; }\n\n  .phase { display: flex; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }\n  .phase:last-child { border-bottom: none; }\n  .phase .n { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: 'Spline Sans Mono', monospace; font-weight: 700; font-size: 13px; }\n  .phase .body { flex: 1; }\n  .phase .body .t { font-size: 14.5px; font-weight: 700; }\n  .phase .body .d { font-size: 13px; color: var(--ink2); margin-top: 2px; }\n  .phase .dep { font-family: 'Spline Sans Mono', monospace; font-size: 10.5px; color: var(--mute); margin-top: 4px; }\n\n  .callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; margin: 14px 0; }\n  .callout p { color: #6e4f14; margin: 0; font-size: 13.5px; }\n  .callout strong { color: #5a3f0f; }\n\n  @media print {\n    body { background: #fff; } .page { box-shadow: none; max-width: none; padding: 0 8px; }\n    section { break-inside: avoid; } .card, .phase, .ep { break-inside: avoid; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"page\">\n\n  <header>\n    <span class=\"secnum\">GANTRY · ENGINEERING PLAN<\u002Fspan>\n    <h1>Missing APIs &amp; Services<\u002Fh1>\n    <p class=\"lede\" style=\"margin-top:14px;\">A build plan for the two services the product design now assumes but the Control API does not yet expose — <strong>Identity Management<\u002Fstrong> and <strong>Workflow Management<\u002Fstrong> — plus the supporting endpoints surfaced while wiring the console, chat, and prototype.<\u002Fp>\n    <div class=\"meta\">\n      <span>Scoped against <span class=\"mono\">apps/core/src/control/server/routes<\u002Fspan><\u002Fspan>\n      <span>Companion to <span class=\"mono\">Gantry Prototype.html<\u002Fspan><\u002Fspan>\n      <span>Status <span class=\"mono\">draft v1<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===================================================== 01 -->\n  <section>\n    <div class=\"sechead\"><span class=\"secnum\">01<\u002Fspan><h2>Where the API stands today<\u002Fh2><\u002Fdiv>\n    <p>The control plane already covers the single-agent, single-conversation surface well. These routes exist and the UI binds to them directly:<\u002Fp>\n    <div class=\"pillrow\">\n      <span class=\"pill have\">agents<\u002Fspan><span class=\"pill have\">capability-catalog<\u002Fspan><span class=\"pill have\">credentials<\u002Fspan>\n      <span class=\"pill have\">jobs<\u002Fspan><span class=\"pill have\">runs<\u002Fspan><span class=\"pill have\">sessions<\u002Fspan>\n      <span class=\"pill have\">memory<\u002Fspan><span class=\"pill have\">models<\u002Fspan><span class=\"pill have\">mcp-servers<\u002Fspan>\n      <span class=\"pill have\">skills<\u002Fspan><span class=\"pill have\">settings<\u002Fspan><span class=\"pill have\">system<\u002Fspan>\n      <span class=\"pill have\">provider-conversations<\u002Fspan><span class=\"pill have\">guided-actions<\u002Fspan>\n      <span class=\"pill partial\">external-ingress<\u002Fspan><span class=\"pill partial\">webhooks<\u002Fspan>\n    <\u002Fdiv>\n    <p>Two are <strong>partial<\u002Fstrong> and matter for what follows: <span class=\"tag\">external-ingress<\u002Fspan> registers inbound entry points and <span class=\"tag\">webhooks<\u002Fspan> exists, but neither is wired to start a multi-step flow or to resolve an external system's <em>completion<\u002Fem> back into a waiting step. And nothing today reconciles a person across providers — memory subject resolution keys directly off the raw provider <span class=\"tag\">userId<\u002Fspan>.<\u002Fp>\n    <div class=\"callout\"><p><strong>The two true gaps:<\u002Fstrong> there is no <strong>workflow<\u002Fstrong> route or service (jobs are single-shot), and there is no <strong>identity / person<\u002Fstrong> graph (a human on Slack and the same human on Telegram are two separate memory subjects). Everything else below is incremental.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================================================== 02 -->\n  <section>\n    <div class=\"sechead\"><span class=\"secnum\">02<\u002Fspan><h2>Service A — Identity Management<\u002Fh2><\u002Fdiv>\n    <p>The console's <strong>People<\u002Fstrong>, <strong>Person + merge<\u002Fstrong>, and per-user <strong>memory continuity<\u002Fstrong> all assume a canonical person that several provider-native senders resolve to. Today that layer does not exist.<\u002Fp>\n\n    <h4>The problem, concretely<\u002Fh4>\n    <p><span class=\"tag\">resolveScopedMemorySubject()<\u002Fspan> builds a user-scoped subject from <span class=\"tag\">input.userId<\u002Fspan> verbatim. So <span class=\"mono\">slack:U0123<\u002Fspan> and <span class=\"mono\">telegram:5759…<\u002Fspan> for the same human produce <em>different<\u002Fem> subjects → split private memory, no continuity. The design promises the opposite: private memory follows the person; group memory never crosses.<\u002Fp>\n\n    <h4>Data model (new)<\u002Fh4>\n    <table class=\"kvtable\">\n      <tbody><tr><th>Entity<\u002Fth><th>Shape<\u002Fth><th>Notes<\u002Fth><\u002Ftr>\n      <tr><td class=\"mono\">person<\u002Ftd><td><span class=\"mono\">id, app_id, display_name, created_at, verified<\u002Fspan><\u002Ftd><td>The canonical human. Memory user-subjects rekey to <span class=\"mono\">person.id<\u002Fspan>.<\u002Ftd><\u002Ftr>\n      <tr><td class=\"mono\">identity_alias<\u002Ftd><td><span class=\"mono\">person_id, provider, native_id, claim, verified_at<\u002Fspan><\u002Ftd><td>One row per provider-native sender. Unique on <span class=\"mono\">(provider, native_id)<\u002Fspan>.<\u002Ftd><\u002Ftr>\n      <tr><td class=\"mono\">identity_merge<\u002Ftd><td><span class=\"mono\">id, from_person, into_person, rekeyed[], conflicts[], actor, ts<\u002Fspan><\u002Ftd><td>Immutable audit of every link/merge — feeds Activity.<\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable>\n\n    <h4>Endpoints (new) — <span class=\"tag\">/v1/people<\u002Fspan><\u002Fh4>\n    <div class=\"card new\">\n      <div class=\"ep\"><span class=\"verb get\">GET<\u002Fspan><div><span class=\"path\">/v1/people<\u002Fspan><div class=\"desc\">List canonical people · filters: linked, unverified, has-pending-merge. Backs the People table.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb get\">GET<\u002Fspan><div><span class=\"path\">/v1/people/:id<\u002Fspan><div class=\"desc\">Person detail: aliases, verification state, private-memory count, recent sessions.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb post\">POST<\u002Fspan><div><span class=\"path\">/v1/people/:id/aliases<\u002Fspan><div class=\"desc\">Link an alias. Requires a verified claim (OIDC/email) <em>or<\u002Fem> admin approval — never auto-link by name.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb post\">POST<\u002Fspan><div><span class=\"path\">/v1/people/:id/merge:preview<\u002Fspan><div class=\"desc\">Dry-run a merge: returns the rekey set, what stays put (group memory), and conflicts. Writes nothing.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb post\">POST<\u002Fspan><div><span class=\"path\">/v1/people/:id/merge<\u002Fspan><div class=\"desc\">Apply merge with per-conflict resolutions. Atomic: rekeys user-scoped memory only, emits <span class=\"mono\">identity.merge<\u002Fspan>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb del\">DEL<\u002Fspan><div><span class=\"path\">/v1/people/:id/aliases/:alias<\u002Fspan><div class=\"desc\">Unlink. Splits memory back out or orphans the alias; audited.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4>Resolver service (the core change)<\u002Fh4>\n    <ul>\n      <li><strong>IdentityResolver<\u002Fstrong> — sits in front of memory subject resolution. Given <span class=\"mono\">(provider, native_id)<\u002Fspan> returns the <span class=\"mono\">person.id<\u002Fspan>, creating an unverified person on first contact.<\u002Fli>\n      <li><strong>Memory rekey<\u002Fstrong> — <span class=\"tag\">resolveScopedMemorySubject()<\u002Fspan> takes <span class=\"mono\">person.id<\u002Fspan> as the user subject instead of the raw <span class=\"mono\">userId<\u002Fspan>. This is the single highest-leverage edit.<\u002Fli>\n      <li><strong>Boundary guard<\u002Fstrong> — merges and rekeys touch <em>user<\u002Fem>-scope subjects only; <span class=\"mono\">group<\u002Fspan>/<span class=\"mono\">channel<\u002Fspan> subjects are excluded at the query layer, enforcing \"channel memory never crosses.\"<\u002Fli>\n      <li><strong>Verification<\u002Fstrong> — an alias becomes verified via an OIDC email match or an explicit admin approval; the unverified state is first-class (the UI shows it).<\u002Fli>\n    <\u002Ful>\n    <div class=\"callout\"><p><strong>Migration:<\u002Fstrong> existing memory subjects keyed on raw <span class=\"mono\">userId<\u002Fspan> need a backfill — seed one person per distinct <span class=\"mono\">userId<\u002Fspan>, then let admins merge. Ship the resolver reading both old and new keys during the transition.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================================================== 03 -->\n  <section>\n    <div class=\"sechead\"><span class=\"secnum\">03<\u002Fspan><h2>Service B — Workflow Management<\u002Fh2><\u002Fdiv>\n    <p>Jobs today are single-shot: one agent, one conversation, one schedule. The design adds <strong>workflows<\u002Fstrong> — an ordered list of sentence steps, typed outcomes as the contract between them, and condition-first routes that pick the next step and <em>when<\u002Fem>. It deliberately reuses the job runtime rather than adding a graph engine.<\u002Fp>\n\n    <h4>Design invariants to preserve in the API<\u002Fh4>\n    <ul>\n      <li><strong>A workflow is a job composite<\u002Fstrong> — each step run is an ordinary job run: runs as its agent, in its conversation, inherits that access, posts there. No workflow-level grants.<\u002Fli>\n      <li><strong>Contract is structured; routing is prose.<\u002Fstrong> Outcomes validate against a per-step schema (agent-proposed, approved once). Routes are natural-language conditions evaluated by a small model.<\u002Fli>\n      <li><strong>Routes are condition-first and target-based<\u002Fstrong> — <span class=\"mono\">{condition, target: stepId|'stop', when: now|cron|{outcome_field}}<\u002Fspan>, ordered, first match wins. Only <span class=\"mono\">stop<\u002Fspan> and <span class=\"mono\">timeout<\u002Fspan> are keywords.<\u002Fli>\n      <li><strong>Rails<\u002Fstrong> — max steps per workflow, and a loop guard so a workflow can't retrigger itself.<\u002Fli>\n    <\u002Ful>\n\n    <h4>Data model (new)<\u002Fh4>\n    <table class=\"kvtable\">\n      <tbody><tr><th>Entity<\u002Fth><th>Shape<\u002Fth><th>Notes<\u002Fth><\u002Ftr>\n      <tr><td class=\"mono\">workflow<\u002Ftd><td><span class=\"mono\">id, name, version, trigger, steps[], enabled, rails<\u002Fspan><\u002Ftd><td>Versioned — see \"edit a live workflow\" below.<\u002Ftd><\u002Ftr>\n      <tr><td class=\"mono\">step<\u002Ftd><td><span class=\"mono\">id, agent_id, conversation_id, prompt, outcome_schema, mode: sync|async, wait, routes[]<\u002Fspan><\u002Ftd><td><span class=\"mono\">async<\u002Fspan> + <span class=\"mono\">wait<\u002Fspan> covers external systems.<\u002Ftd><\u002Ftr>\n      <tr><td class=\"mono\">workflow_run<\u002Ftd><td><span class=\"mono\">id, workflow_id, version, trigger_event, status, cursor, step_runs[]<\u002Fspan><\u002Ftd><td>Status: running · waiting · stopped · failed · done.<\u002Ftd><\u002Ftr>\n      <tr><td class=\"mono\">route_decision<\u002Ftd><td><span class=\"mono\">run_id, step_id, chosen_target, when, reasoning<\u002Fspan><\u002Ftd><td>Recorded per hop → Activity. Answers \"why did step 2 run?\".<\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable>\n\n    <h4>Endpoints (new) — <span class=\"tag\">/v1/workflows<\u002Fspan><\u002Fh4>\n    <div class=\"card new\">\n      <div class=\"ep\"><span class=\"verb post\">POST<\u002Fspan><div><span class=\"path\">/v1/workflows:draft<\u002Fspan><div class=\"desc\">Agent drafts steps + outcome schemas from a prose description. Returns an unsaved draft + readiness blockers.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb post\">POST<\u002Fspan><div><span class=\"path\">/v1/workflows<\u002Fspan><div class=\"desc\">Create/save. Validates rails (max steps, no self-trigger) and that referenced agents are bound in their conversations.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb get\">GET<\u002Fspan><div><span class=\"path\">/v1/workflows · /:id<\u002Fspan><div class=\"desc\">List (rows inside Jobs) and detail (the builder).<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb patch\">PATCH<\u002Fspan><div><span class=\"path\">/v1/workflows/:id<\u002Fspan><div class=\"desc\">Edit → mints a new version. In-flight runs finish on their version; next trigger starts the new one.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb post\">POST<\u002Fspan><div><span class=\"path\">/v1/workflows/:id:enable / :disable<\u002Fspan><div class=\"desc\">Gated on readiness — enable stays blocked until every blocker clears.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb post\">POST<\u002Fspan><div><span class=\"path\">/v1/workflows/:id:dry-run<\u002Fspan><div class=\"desc\">Runs read-only: validates schemas, shows the would-be route, skips writes/posts/approvals.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb get\">GET<\u002Fspan><div><span class=\"path\">/v1/workflow-runs/:id (SSE)<\u002Fspan><div class=\"desc\">Live run timeline: step outcomes, route decisions + reasoning, waits, failures. Backs the Run view.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"ep\"><span class=\"verb post\">POST<\u002Fspan><div><span class=\"path\">/v1/workflow-runs/:id:replay<\u002Fspan><div class=\"desc\">Resume from the failed step. Nothing half-applies — later steps simply never ran.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4>Services (new)<\u002Fh4>\n    <ul>\n      <li><strong>WorkflowDraftService<\u002Fstrong> — LLM drafts steps, proposes outcome schemas, computes the readiness checklist (agents bound? schema approved? credentials present?).<\u002Fli>\n      <li><strong>WorkflowOrchestrator<\u002Fstrong> — on a step's completion: validate outcome → if invalid, stop honestly; else evaluate routes in order; schedule the target step as a job, immediately or deferred (<span class=\"mono\">now | cron | {outcome_field}<\u002Fspan>).<\u002Fli>\n      <li><strong>RouteEvaluator<\u002Fstrong> — small-model call over <span class=\"mono\">{outcome, routes[]}<\u002Fspan> → chosen target + reasoning, persisted as <span class=\"mono\">route_decision<\u002Fspan>.<\u002Fli>\n      <li><strong>AsyncStepCoordinator<\u002Fstrong> — parks a step awaiting an external completion (webhook or poll, declared by the tool) up to its <span class=\"mono\">wait<\u002Fspan>; on expiry takes the mandatory <span class=\"mono\">timeout<\u002Fspan> route. Same pause primitive as a human approval step.<\u002Fli>\n    <\u002Ful>\n\n    <h4>Triggers — extend, don't rebuild<\u002Fh4>\n    <p>The design's four start types map onto existing infra: <span class=\"tag\">cron<\u002Fspan> (scheduler, present), <span class=\"tag\">@mention<\u002Fspan> (sessions/provider-conversations, present), <span class=\"tag\">job-completion<\u002Fspan> (chain off any job — small addition), and <span class=\"tag\">webhook<\u002Fspan> (reuse <span class=\"tag\">external-ingress<\u002Fspan> / <span class=\"tag\">webhooks<\u002Fspan>, wire to a workflow-start event). The async-step completion path reuses the <em>same<\u002Fem> ingress to resolve a waiting step.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ===================================================== 04 -->\n  <section>\n    <div class=\"sechead\"><span class=\"secnum\">04<\u002Fspan><h2>Supporting endpoints surfaced by the UI<\u002Fh2><\u002Fdiv>\n    <p>Smaller gaps the prototype assumes. Each is a thin addition over existing services, not a new domain.<\u002Fp>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <h3>Approval policy &amp; escalation<\u002Fh3>\n        <div class=\"pillrow\"><span class=\"pill gap\">new<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;\">Per-conversation approver roster (primary + backup) and an unanswered-ask ladder: remind → escalate to backup → expire. Extends provider-conversations + the permission-request path.<\u002Fp>\n        <span class=\"tag\">PATCH /v1/conversations/:id/approval-policy<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3>\"Waiting on you\" feed<\u002Fh3>\n        <div class=\"pillrow\"><span class=\"pill partial\">aggregate<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;\">Read-only list of pending asks for the signed-in admin, with provider deep-links. An aggregation over existing permission-requests — decisions still happen in chat.<\u002Fp>\n        <span class=\"tag\">GET /v1/approvals?waiting-on=me<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3>Agent pause / kill switch<\u002Fh3>\n        <div class=\"pillrow\"><span class=\"pill gap\">new<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;\">Pause an agent across all bindings; in-flight runs finish their step then hold; jobs skip while paused. Audited, reversible.<\u002Fp>\n        <span class=\"tag\">POST /v1/agents/:id:pause · :resume<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3>Memory transparency (end user)<\u002Fh3>\n        <div class=\"pillrow\"><span class=\"pill partial\">scope<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;\">A user reads &amp; forgets <em>their own<\u002Fem> private memory across chats. Scoped read/delete over the memory service, keyed by <span class=\"mono\">person.id<\u002Fspan> (depends on Service A).<\u002Fp>\n        <span class=\"tag\">GET·DELETE /v1/me/memory<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3>Budget &amp; cost guard<\u002Fh3>\n        <div class=\"pillrow\"><span class=\"pill gap\">new<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;\">Daily spend cap with honest behavior at the limit: new runs queue, conversations get a \"paused until reset\" reply, in-flight approvals still resolve.<\u002Fp>\n        <span class=\"tag\">GET·PATCH /v1/budget<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h3>Profile &amp; sessions<\u002Fh3>\n        <div class=\"pillrow\"><span class=\"pill partial\">thin<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;\">Current user, roles (mirrored from OIDC), theme/notification prefs, active sessions + sign-out. Mostly a read over auth + a small prefs store.<\u002Fp>\n        <span class=\"tag\">GET /v1/me · GET·DELETE /v1/me/sessions<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================================================== 05 -->\n  <section>\n    <div class=\"sechead\"><span class=\"secnum\">05<\u002Fspan><h2>Further gaps to weigh<\u002Fh2><\u002Fdiv>\n    <p>Beyond the two services and the six account endpoints, the full route inventory has no home for the following. None block a first launch, but each is load-bearing for trust, scale, or the eventual <strong>Capcom<\u002Fstrong> multi-org layer — naming them now keeps them out of the \"discovered in production\" pile.<\u002Fp>\n\n    <h4>Trust, compliance &amp; data rights<\u002Fh4>\n    <ul>\n      <li><strong>Right to be forgotten / data export<\u002Fstrong> — a person asks to be deleted or to export everything. Today only per-item memory forget exists; there is no person-level erase or <span class=\"mono\">GET /v1/people/:id/export<\u002Fspan>. Depends on Service A.<\u002Fli>\n      <li><strong>Conversation transcript access<\u002Fstrong> — Audit logs <em>events<\u002Fem>, but there is no route to read what an agent actually said in a conversation. Admins debugging \"why did it reply that?\" need a scoped, access-controlled transcript read — with its own retention &amp; redaction policy.<\u002Fli>\n      <li><strong>Control-API key management<\u002Fstrong> — keys/scopes are checked everywhere (<span class=\"mono\">authorizeControlRequest<\u002Fspan>) but there is no route to <em>issue, scope, rotate, or revoke<\u002Fem> them. Needed the moment a second SDK app or integration exists.<\u002Fli>\n      <li><strong>Secret rotation &amp; expiry<\u002Fstrong> — credentials store refs, but nothing warns on aging tokens or drives rotation. A provider token silently expiring is a classic \"agent went quiet\" incident.<\u002Fli>\n      <li><strong>Audit retention &amp; SIEM export<\u002Fstrong> — Activity is the trail; enterprises will want retention windows and a streaming/export hook to their own log sink.<\u002Fli>\n    <\u002Ful>\n\n    <h4>Reliability &amp; scale<\u002Fh4>\n    <ul>\n      <li><strong>Fleet / worker health<\u002Fstrong> — <span class=\"mono\">fleet-boot<\u002Fspan> and <span class=\"mono\">worker-identity<\u002Fspan> exist in the runtime, but no route surfaces worker liveness, run-claim ownership, or leader state. Diagnostics covers the single host; multi-worker needs its own view.<\u002Fli>\n      <li><strong>End-user chat rate limiting<\u002Fstrong> — job triggers are rate-limited; an end user spamming the web chat is not visibly governed. Per-person throttle with an honest \"slow down\" reply.<\u002Fli>\n      <li><strong>Stream reconnect contract<\u002Fstrong> — sessions are SSE and the runtime has partial-delivery handling; the API should formalize resume-from-cursor so a dropped web socket doesn't lose or duplicate a streamed reply.<\u002Fli>\n    <\u002Ful>\n\n    <h4>Agent lifecycle<\u002Fh4>\n    <ul>\n      <li><strong>Version history, diff &amp; rollback<\u002Fstrong> — the UI shows \"v7 → v8\" but there is no <span class=\"mono\">GET /v1/agents/:id/versions<\u002Fspan> or rollback. Settings has <span class=\"mono\">/revisions<\u002Fspan> for desired-state; agent-level history and one-click rollback should mirror it.<\u002Fli>\n      <li><strong>Pre-deploy eval / smoke test<\u002Fstrong> — the deploy flow has a dry run, but no way to test a persona against sample inputs or guard against regressions before promoting a version.<\u002Fli>\n      <li><strong>Skill / MCP update review<\u002Fstrong> — when an installed MCP server changes its exposed tools, that should re-enter the capability review path rather than silently widening access.<\u002Fli>\n    <\u002Ful>\n\n    <h4>Proactive operations<\u002Fh4>\n    <ul>\n      <li><strong>Alerting / notification channels<\u002Fstrong> — everything today is pull (dashboard, doctor). There is no push when a provider drops, the budget trips, or dead-letters spike. An admin shouldn't learn from a user that the agent is down.<\u002Fli>\n      <li><strong>Usage metering &amp; billing aggregation<\u002Fstrong> — per-run cost exists; there is no rollup per agent / per person / per period for chargeback or the per-seat billing Capcom will need.<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"callout\"><p><strong>Capcom horizon:<\u002Fstrong> the <span class=\"mono\">app_id<\u002Fspan> namespace already scopes data, but cross-org isolation guarantees, per-org quotas, and a fleet-of-deployments view are out of scope here by design — they belong to the higher layer, and several gaps above (key management, metering, audit export) are the seams it will plug into.<\u002Fp><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================================================== 06 -->\n  <section>\n    <div class=\"sechead\"><span class=\"secnum\">06<\u002Fspan><h2>Sequencing<\u002Fh2><\u002Fdiv>\n    <p>Ordered by dependency, not by screen. Identity is first because memory continuity and end-user transparency both ride on it.<\u002Fp>\n\n    <div class=\"phase\"><span class=\"n\">1<\u002Fspan><div class=\"body\"><div class=\"t\">Identity foundation<\u002Fdiv><div class=\"d\">person + identity_alias tables, IdentityResolver, rekey memory subject resolution to <span class=\"mono\">person.id<\u002Fspan>, backfill. No UI change required to land it.<\u002Fdiv><div class=\"dep\">unblocks: People, memory continuity, /v1/me/memory<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"phase\"><span class=\"n\">2<\u002Fspan><div class=\"body\"><div class=\"t\">Identity surface<\u002Fdiv><div class=\"d\">/v1/people list + detail + alias link + merge preview/apply with conflict resolution and identity.merge audit.<\u002Fdiv><div class=\"dep\">depends: 1 · backs People, Person + merge<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"phase\"><span class=\"n\">3<\u002Fspan><div class=\"body\"><div class=\"t\">Workflow core<\u002Fdiv><div class=\"d\">workflow + workflow_run model, WorkflowOrchestrator + RouteEvaluator over the existing job runtime, run-event SSE. Cron + job-completion triggers.<\u002Fdiv><div class=\"dep\">depends: jobs (present) · backs Builder, Run view<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"phase\"><span class=\"n\">4<\u002Fspan><div class=\"body\"><div class=\"t\">Workflow authoring &amp; async<\u002Fdiv><div class=\"d\">:draft, readiness gating, :dry-run, versioned PATCH; AsyncStepCoordinator + webhook/poll completion via external-ingress; timeout routes.<\u002Fdiv><div class=\"dep\">depends: 3, external-ingress · backs New workflow, Draft, External systems<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"phase\"><span class=\"n\">5<\u002Fspan><div class=\"body\"><div class=\"t\">Governance &amp; account<\u002Fdiv><div class=\"d\">Approval policy + escalation, \"waiting on you\" feed, agent pause, budget guard, profile/sessions/prefs.<\u002Fdiv><div class=\"dep\">independent · hardens the worst-day paths<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <section>\n    <div class=\"sechead\"><span class=\"secnum\">07<\u002Fspan><h2>Open questions for the API owner<\u002Fh2><\u002Fdiv>\n    <ul>\n      <li><strong>Person backfill strategy<\u002Fstrong> — seed one person per raw <span class=\"mono\">userId<\u002Fspan> and let admins merge, or attempt a verified-claim auto-link pass first? The UI supports either.<\u002Fli>\n      <li><strong>Route evaluator model<\u002Fstrong> — which slot pays for routing calls (its own cheap default, or the workflow's recurring-job model)? Affects the Models defaults.<\u002Fli>\n      <li><strong>Async completion correlation<\u002Fstrong> — does the external tool echo a <span class=\"mono\">step_run_id<\u002Fspan> we mint, or do we correlate on a tool-provided token? Determines the ingress contract.<\u002Fli>\n      <li><strong>Workflow versioning retention<\u002Fstrong> — keep all versions for run-history fidelity, or prune past N? Run view shows the version each run used.<\u002Fli>\n    <\u002Ful>\n    <p class=\"note\">This plan maps every screen in the prototype to a concrete service. Nothing in the UI assumes a capability that isn't accounted for here — and nothing here exists purely for the UI's sake.<\u002Fp>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
