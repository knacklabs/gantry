<script>
"use strict";

/* ═══ helpers ═══════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
// Every consumer reads REDUCE.matches at call time, so an OS toggle applies
// on the next poll without a reload — no change listener needed.
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)");
const ENTER = "cubic-bezier(.32,.72,0,1)";

/* Minimal markdown for what plans actually use. Input is escaped FIRST, so
   nothing here can inject — the patterns only add tags around safe text. */
// Frontmatter is metadata for the gates, not prose: rendering it put
// "slug: …", "status: confirmed" and a stray --- above a spec's own title.
// Stripped HERE, at render, so the API keeps returning the exact source.
function stripFrontmatter(src) {
  return String(src || "").replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, "");
}

function md(src) {
  // Comments are notes the author wrote to themselves — a template hint, a
  // "review before merge" reminder. Stripped BEFORE escaping, or they escape
  // into visible text. (Safe: removing content can never inject.)
  const lines = esc(String(src ?? "").replace(/<!--[\s\S]*?-->/g, "")).split(/\r?\n/);
  const out = [];
  let list = null, fence = false;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*]+)\*/g, "$1<em>$2</em>");
  const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  const isDivider = (row) => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(row) && row.includes("-");
  // A run of consecutive non-blank text lines is ONE paragraph. Hard-wrapped
  // source (specs, briefs) must reflow to fill the measure, not stack as one
  // <p> per source line with a gap between every wrapped fragment.
  let para = [];
  const flushPara = () => {
    if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; }
  };
  // Blockquote lines (`> …`, escaped to `&gt; …`) reflow into one callout.
  let quote = [];
  const flushQuote = () => {
    if (quote.length) { out.push(`<blockquote><p>${inline(quote.join(" "))}</p></blockquote>`); quote = []; }
  };
  for (let index = 0; index < lines.length; index++) {
    const line = lines[index];
    // A table is a header row followed by a divider — the shape every plan's
    // Surface Impact uses, and the one thing here that must not read as pipes.
    if (!fence && line.trim().startsWith("|") && isDivider(lines[index + 1] || "")) {
      flushPara();
      flushQuote();
      closeList();
      const head = cells(line);
      const body = [];
      let cursor = index + 2;
      while (cursor < lines.length && lines[cursor].trim().startsWith("|")) {
        body.push(cells(lines[cursor]));
        cursor++;
      }
      out.push(`<div class="tablewrap"><table><thead><tr>${
        head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
        body.map(row => `<tr>${row.map((c, n) =>
          `<td${n === 0 ? ' class="rowhead"' : ""}>${inline(c)}</td>`).join("")}</tr>`)
          .join("")}</tbody></table></div>`);
      index = cursor - 1;
      continue;
    }
    if (/^```/.test(line)) {
      flushPara();
      flushQuote();
      closeList();
      out.push(fence ? "</code></pre>" : "<pre><code>");
      fence = !fence;
      continue;
    }
    if (fence) { out.push(line); continue; }
    // Blockquote first: `>` is already escaped to `&gt;` by the time we get here.
    const bq = line.match(/^\s*&gt;\s?(.*)$/);
    if (bq) { flushPara(); closeList(); quote.push(bq[1]); continue; }
    flushQuote();
    const heading = line.match(/^(#{1,3})\s+(.*)$/);
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    const numbered = line.match(/^\s*\d+\.\s+(.*)$/);
    if (heading) {
      flushPara();
      closeList();
      const level = heading[1].length;
      out.push(`<h${level}>${inline(heading[2])}</h${level}>`);
    } else if (bullet) {
      flushPara();
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${inline(bullet[1])}</li>`);
    } else if (numbered) {
      flushPara();
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${inline(numbered[1])}</li>`);
    } else if (!line.trim()) {
      flushPara();
      closeList();
    } else if (list) {
      // Lazy continuation: a hard-wrapped bullet/number body (specs wrap at
      // ~80 cols) belongs to the item above, not a new left-aligned paragraph.
      out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, " " + inline(line.trim()) + "</li>");
    } else {
      closeList();
      para.push(line);
    }
  }
  flushPara();
  flushQuote();
  closeList();
  if (fence) out.push("</code></pre>");
  return `<div class="md">${out.join("\n")}</div>`;
}

const rawBlock = (value) => `<pre class="raw">${esc(JSON.stringify(value, null, 2))}</pre>`;
const kindLabel = (kind) => `<span class="type-label">${esc(kind)}</span>`;

// Command-shaped fragments read as commands, so mark them up as such.
// Escaped first; the replacements only wrap already-safe text.
const asCode = (s) => esc(s)
  .replace(/(^|\s)((?:\.\/forge|forge\.py|python3|\/grill-me)[^,;()]*)/g, "$1<code>$2</code>")
  .replace(/^\[([^\]]+)\]/, "<b>[$1]</b>");

let repoRoot = "";
// Opens the real file in the editor — review in the browser, edit in VS Code.
const openFile = (rel, label) => rel
  ? `<a class="filelink" href="vscode://file/${esc(repoRoot)}/${esc(rel)}">${esc(label || rel)} ↗</a>`
  : "";

const prReference = (story) => {
  const reference = String((story || {}).pr_link || "");
  if (!reference) return "";
  return /^https?:\/\//i.test(reference)
    ? `<a class="filelink" href="${esc(reference)}" target="_blank" rel="noopener noreferrer">${esc(reference)} ↗</a>`
    : `<span>${esc(reference)}</span>`;
};

/* ═══ lifecycle model ═══════════════════════════════════════════════════ */
/* The gate sequence, as the drawer's rail reads it. "Story derived" is not a
   station: every card on this board is already a roadmap item, so the flag was
   always true and its column could never hold a card. */
const STATIONS = ["Spec", "Plan", "Build", "Checks", "Ship"];
/* Column headings name what a card IS, not the gate it faces — a card under
   "Plan" reads as planned when it means the opposite. */
const COLUMNS = ["Needs spec", "Awaiting plan", "Building", "In checks", "Shipped"];
// todo is an empty ring — the badge outline already reads as "pending".
const FLAG_GLYPH = {done: "✓", partial: "◐", todo: "", gap: "✗"};
const STATE_GLYPH = {shipped: "✓", building: "◐", ready: "★", blocked: "⊘", waiting: "·"};
const STATE_WORD = {shipped: "shipped", building: "building", ready: "ready to plan",
                    blocked: "blocked", waiting: "waiting"};

const REVIEW_ASPECTS = ["quality", "performance", "security"];
/* verify + tests + one review per aspect — the gates pr_ready.py demands. */
const CHECKS_TOTAL = 2 + REVIEW_ASPECTS.length;

function checksDone(lc) {
  const reviews = lc.reviews || {};
  const reviewed = REVIEW_ASPECTS.filter(a => reviews[a]).length;
  return [lc.verify, lc.tests].filter(Boolean).length + reviewed;
}

/** One flag per station: done | partial | todo | gap, plus a short note. */
function stationFlags(story) {
  const lc = story.lifecycle || {};
  const st = lc.stages;
  const done = checksDone(lc);
  return [
    {flag: lc.spec === "confirmed" ? "done" : (lc.spec === "draft" ? "partial" : "gap"),
     note: lc.spec === "confirmed" ? "" : String(lc.spec || "missing")},
    {flag: lc.planned ? "done" : "todo", note: ""},
    {flag: !st || !st.total ? "todo" : (st.done === st.total ? "done" : (st.done ? "partial" : "todo")),
     note: st && st.total ? `${st.done}/${st.total}` : ""},
    {flag: done === CHECKS_TOTAL ? "done" : (done ? "partial" : "todo"),
     note: done ? `${done}/${CHECKS_TOTAL}` : ""},
    {flag: lc.shipped ? "done" : "todo", note: ""},
  ];
}

/** The column a story sits in: the first station it has not cleared. */
function columnOf(story) {
  const last = STATIONS.length - 1;
  if (story.lifecycle && story.lifecycle.shipped) return last;
  const flags = stationFlags(story);
  const at = flags.findIndex(s => s.flag !== "done");
  return at === -1 ? last : at;
}

/** Transitive count of not-yet-shipped stories each story unblocks. */
function leverageMap(stories) {
  const dependents = new Map();
  for (const s of stories) {
    for (const dep of s.depends_on || []) {
      if (!dependents.has(dep)) dependents.set(dep, []);
      dependents.get(dep).push(s.key);
    }
  }
  const shipped = new Set(stories.filter(s => s.state === "shipped").map(s => s.key));
  const out = new Map();
  for (const s of stories) {
    const seen = new Set();
    const queue = [...(dependents.get(s.key) || [])];
    while (queue.length) {
      const key = queue.shift();
      if (seen.has(key)) continue;
      seen.add(key);
      queue.push(...(dependents.get(key) || []));
    }
    out.set(s.key, [...seen].filter(k => !shipped.has(k)).length);
  }
  return out;
}

const DAY = 86400000;
function ageDays(iso) {
  const t = Date.parse(iso || "");
  if (!t) return null;
  // Clamp at zero: a clock skew between the recording machine and this
  // browser must read "today", never "-1 days ago".
  return Math.max(0, Math.floor((Date.now() - t) / DAY));
}

/** At most one derived marker per card — blockers first, then leverage,
    then a stall old enough to be worth saying out loud. */
function cardMark(story, leverage) {
  const waiting = story.blocked_by || [];
  if (story.state === "blocked") {
    return waiting.length
      ? `⊘ blocked by ${waiting.slice(0, 2).join(", ")}${waiting.length > 2 ? "…" : ""}`
      : "⊘ blocked";
  }
  if (story.state === "waiting") return "· waiting";
  if (story.state === "ready") {
    const n = leverage.get(story.key) || 0;
    return n ? `★ unblocks ${n}` : "★ ready to plan";
  }
  if (story.state === "building") {
    const days = ageDays(story.plan && story.plan.saved);
    if (days !== null && days >= 2) return `◷ building ${days}d`;
  }
  return "";
}

/* ═══ since you last looked ═════════════════════════════════════════════ */
// A card's signature: everything that would move or change it on the board.
const signature = (s) => {
  const lc = s.lifecycle || {};
  const st = lc.stages;
  return [columnOf(s), s.state, st ? `${st.done}/${st.total}` : "-", checksDone(lc)].join("|");
};
const changed = new Set();
let snapshot = null;

function readSnapshot(root) {
  try { return JSON.parse(localStorage.getItem("forge-board:" + root) || "null"); }
  catch { return null; }
}
let lastSnapshot = "";
function writeSnapshot(root, map) {
  // Only on a real change — this runs every poll, and the board is idle most
  // of the time.
  const text = JSON.stringify(map);
  if (text === lastSnapshot) return;
  lastSnapshot = text;
  try { localStorage.setItem("forge-board:" + root, text); } catch { /* private mode */ }
}

/* ═══ header ════════════════════════════════════════════════════════════ */
function renderRunline(state) {
  const run = state.run || {};
  $("runline").innerHTML = run.issue_key
    ? `run <b class="key">${esc(run.issue_key)}</b> · phase <b>${esc(run.phase || "—")}</b> · plan <b>${esc(run.plan_status || "—")}</b>`
    : `no active task · phase <b>${esc(run.phase || "—")}</b>`;
}

const barSegments = new Map();
function renderProgress(state) {
  const sum = state.summary && state.summary.stories;
  const bar = $("bar");
  if (!sum || !sum.total) {
    bar.hidden = true;
    $("progress-line").textContent = "";
    return;
  }
  bar.hidden = false;
  const total = sum.total;
  const parts = [
    ["shipped", sum.shipped], ["building", sum.building],
    ["ready", sum.ready], ["blocked", sum.blocked], ["waiting", sum.waiting],
  ];
  for (const [cls, n] of parts) {
    let seg = barSegments.get(cls);
    if (!seg) {
      seg = document.createElement("i");
      seg.className = cls;
      bar.appendChild(seg);
      barSegments.set(cls, seg);
    }
    seg.style.width = `${(n / total) * 100}%`;
  }
  bar.setAttribute("aria-label",
    `${sum.shipped} of ${total} stories shipped, ${sum.building} building, ` +
    `${sum.ready} ready to plan, ${sum.blocked} blocked, ${sum.waiting} waiting`);
  const cell = (cls, glyph, n, word) =>
    `<span class="k-${cls}"><em>${glyph}</em><b>${n}</b> ${word}</span>`;
  $("progress-line").innerHTML =
    `<span class="k-shipped"><em>✓</em><b>${sum.shipped}/${total}</b> shipped</span>` +
    (sum.building ? cell("building", "◐", sum.building, "building") : "") +
    (sum.ready ? cell("ready", "★", sum.ready, "ready to plan") : "") +
    (sum.blocked ? cell("blocked", "⊘", sum.blocked, "blocked") : "") +
    (sum.waiting ? cell("waiting", "·", sum.waiting, "waiting") : "");
}

function renderBanner(state) {
  const rows = [];
  for (const sig of state.signals || []) {
    rows.push(`<div class="flag urgent"><em>⚠</em>
      <b>Worker paused — ${esc(sig.kind)}</b>
      <span>${esc(sig.id)}: ${esc(sig.message || "")}</span>
      <span class="do">Answer it in your session — the worker stays paused until you do.</span></div>`);
  }
  if (state.quickfix) {
    const q = state.quickfix;
    rows.push(`<div class="flag urgent"><em>◆</em>
      <b>Quickfix window open</b>
      <span>${esc(q.id)} — ${esc(q.reason || "")} (${(q.files || []).length}/${esc(q.max_files)} files)</span>
      <span class="do">Close it in your session once the fix lands.</span></div>`);
  }
  const a = (state.summary || {}).attention || {};
  const quiet = [];
  if (a.assumptions) quiet.push(`${plural(a.assumptions, "assumption")} to guide`);
  if ((a.spec_gaps || []).length)
    quiet.push(`${plural(a.spec_gaps.length, "story")} ahead of its spec (${a.spec_gaps.map(esc).join(", ")})`);
  if (quiet.length) rows.push(`<div class="flag"><em>·</em><span>${quiet.join(" · ")}</span></div>`);
  $("banner").innerHTML = rows.join("");
  $("banner").hidden = rows.length === 0;
}

function renderNext(state) {
  const next = state.next || {};
  const steps = next.steps || [];
  if (!steps.length && !next.phase) { $("next").hidden = true; return; }
  $("next").hidden = false;
  $("next-verb").textContent = steps[0] ? steps[0].replace(/^\[[^\]]+\]\s*/, "") : `phase ${next.phase || "—"}`;
  $("next-count").textContent = steps.length > 1 ? `${steps.length} steps` : (next.phase || "");
  $("next-list").innerHTML = steps.map(s => `<li>${asCode(s)}</li>`).join("");
}
$("next-toggle").addEventListener("click", () => {
  const open = $("next-steps").classList.toggle("open");
  $("next-toggle").setAttribute("aria-expanded", String(open));
});

let bottleneck = -1;
const colCells = [];
function renderColhead() {
  if (colCells.length) return;
  const head = $("colhead");
  COLUMNS.forEach((label, i) => {
    const cell = document.createElement("div");
    cell.innerHTML = `<span>${label}</span><span class="bn"></span>`;
    head.appendChild(cell);
    colCells.push(cell);
  });
}

/** The station holding the most unshipped work — why the board feels stuck. */
function findBottleneck(stories) {
  const counts = COLUMNS.map(() => 0);
  for (const s of stories) if (s.state !== "shipped") counts[columnOf(s)]++;
  const upstream = counts.slice(0, COLUMNS.length - 1);
  let best = -1, top = 1;
  upstream.forEach((n, i) => { if (n > top) { top = n; best = i; } });
  if (best >= 0 && upstream.filter(n => n === top).length > 1) return -1;
  return best;
}

/* ═══ lanes — keyed diff and patch ══════════════════════════════════════ */
const cards = new Map();   // story key -> {el, key, sig, col, title, mark, state, dot}
const lanes = new Map();   // epic key  -> {el, cells[6], countEl}
let firstPaint = true;

function makeCard(key) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "card";
  el.dataset.key = key;
  el.innerHTML = `<span class="card-top">
      <span class="card-glyph" aria-hidden="true"></span>
      ${kindLabel("STORY")}
      <span class="card-key"></span>
      <span class="card-dot" hidden aria-hidden="true"></span>
    </span>
    <span class="card-title"></span>
    <span class="card-mark"></span>`;
  el.addEventListener("click", () => {
    if (changed.delete(key)) el.querySelector(".card-dot").hidden = true;
    openDrawer(key, el);
  });
  return el;
}

function makeLane(key, name) {
  const el = document.createElement("section");
  el.className = "lane";
  el.dataset.epic = key;
  el.innerHTML = `<div class="lane-head">
      ${kindLabel("EPIC")}<h2 class="lane-name"></h2><span class="lane-rule"></span>
      <span class="lane-count"></span>
    </div><div class="lane-grid"></div>`;
  el.querySelector(".lane-name").textContent = name;
  const grid = el.querySelector(".lane-grid");
  const cells = COLUMNS.map((_, i) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.col = String(i);
    grid.appendChild(cell);
    return cell;
  });
  return {el, cells, countEl: el.querySelector(".lane-count"), nameEl: el.querySelector(".lane-name")};
}

function rollCount(el, text) {
  if (el.textContent === text) return;
  const had = el.textContent !== "";
  el.textContent = text;
  if (had && !REDUCE.matches) {
    el.animate([{opacity: 0, transform: "translateY(-.35em)"}, {opacity: 1, transform: "none"}],
               {duration: 260, easing: "ease-out"});
  }
}

function patchLanes(state) {
  const stories = state.stories || [];
  const host = $("lanes");
  $("empty").hidden = stories.length > 0;
  if (!stories.length) {
    $("empty").innerHTML = `No stories yet. They are derived from confirmed specs — save specs
      while prototyping, confirm them, then ask for the roadmap.`;
  }

  // 1. measure, before anything moves
  const before = new Map();
  if (!firstPaint && !REDUCE.matches) {
    for (const [key, card] of cards) before.set(key, card.el.getBoundingClientRect());
  }

  // 2. lanes, in roadmap order
  const titles = new Map((state.epics || []).map(e => [e.id, e.title || e.id]));
  const order = [];
  const grouped = new Map();
  for (const s of stories) {
    const epic = s.epic || "Backlog";
    if (!grouped.has(epic)) { grouped.set(epic, []); order.push(epic); }
    grouped.get(epic).push(s);
  }
  let anchor = host.firstElementChild;
  for (const epic of order) {
    let lane = lanes.get(epic);
    if (!lane) { lane = makeLane(epic, titles.get(epic) || epic); lanes.set(epic, lane); }
    else lane.nameEl.textContent = titles.get(epic) || epic;
    if (lane.el !== anchor) host.insertBefore(lane.el, anchor);
    anchor = lane.el.nextElementSibling;
  }
  for (const [epic, lane] of lanes) {
    if (!grouped.has(epic)) { lane.el.remove(); lanes.delete(epic); }
  }

  // 3. cards — created once, moved only when their position actually changes
  const leverage = leverageMap(stories);
  const bn = findBottleneck(stories);
  if (bn !== bottleneck) {
    bottleneck = bn;
    colCells.forEach((cell, i) => {
      cell.classList.toggle("bottleneck", i === bn);
      cell.querySelector(".bn").textContent = i === bn ? "◆ bottleneck" : "";
    });
  }
  for (const lane of lanes.values()) {
    lane.cells.forEach((cell, i) => cell.classList.toggle("bottleneck", i === bn));
  }

  const advanced = new Set();
  const live = new Set();
  const cursor = new Map();
  const nextSnapshot = {};
  for (const epic of order) {
    const lane = lanes.get(epic);
    let shipped = 0;
    // Within a column, the story that unblocks the most work comes first —
    // the leverage number is only half the signal if position ignores it.
    // Stable, so equal leverage keeps roadmap order.
    const ranked = grouped.get(epic).slice().sort((a, b) =>
      columnOf(a) - columnOf(b) ||
      (leverage.get(b.key) || 0) - (leverage.get(a.key) || 0));
    for (const story of ranked) {
      const key = story.key;
      live.add(key);
      let card = cards.get(key);
      if (!card) { card = {el: makeCard(key), sig: null, col: null}; cards.set(key, card); }
      const el = card.el;
      const col = columnOf(story);
      const sig = signature(story);
      nextSnapshot[key] = sig;
      if (story.state === "shipped") shipped++;

      if (card.sig !== sig) {
        if (card.sig !== null) { advanced.add(key); changed.add(key); }
        card.sig = sig;
      }
      // text updates are idempotent; only write what differs
      const glyph = STATE_GLYPH[story.state] || "·";
      const title = story.title || "";
      const mark = cardMark(story, leverage);
      if (el.dataset.state !== story.state) el.dataset.state = story.state;
      if (card.glyph !== glyph) { el.querySelector(".card-glyph").textContent = glyph; card.glyph = glyph; }
      if (card.key !== key) { el.querySelector(".card-key").textContent = key; card.key = key; }
      if (card.title !== title) { el.querySelector(".card-title").textContent = title; card.title = title; }
      if (card.mark !== mark) { el.querySelector(".card-mark").textContent = mark; card.mark = mark; }
      el.querySelector(".card-dot").hidden = !changed.has(key);
      el.setAttribute("aria-label",
        `Story ${key}${title ? " — " + title : ""}. ${STATE_WORD[story.state] || story.state}, at ${COLUMNS[col]}.` +
        `${mark ? " " + mark.replace(/^\S\s/, "") + "." : ""}${changed.has(key) ? " Changed." : ""}`);

      const cell = lane.cells[col];
      const after = cursor.get(cell) || null;
      const want = after ? after.nextElementSibling : cell.firstElementChild;
      if (want !== el) cell.insertBefore(el, want);
      cursor.set(cell, el);
      card.col = col;
    }
    rollCount(lane.countEl, `${shipped} of ${grouped.get(epic).length} shipped`);
  }
  for (const [key, card] of cards) {
    if (!live.has(key)) { card.el.remove(); cards.delete(key); changed.delete(key); }
  }

  // 4. FLIP — the only automatic animation on the board. Restricted to cards
  // that actually advanced: a card merely displaced by one above it changing
  // must jump, or an ordinary reflow would animate half the board.
  if (before.size && advanced.size) {
    // Read every rect first, then write — interleaving them forces a
    // synchronous layout per card.
    const moves = [];
    for (const key of advanced) {
      const card = cards.get(key), was = before.get(key);
      if (!card || !was) continue;
      const now = card.el.getBoundingClientRect();
      moves.push([card.el, was.left - now.left, was.top - now.top]);
    }
    for (const [el, dx, dy] of moves) {
      if (Math.abs(dx) >= 0.5 || Math.abs(dy) >= 0.5) {
        el.animate([{transform: `translate(${dx}px, ${dy}px)`}, {transform: "none"}],
                   {duration: 400, easing: ENTER});
      }
      el.classList.add("settling");
      setTimeout(() => el.classList.remove("settling"), 340);
    }
  }

  // 5. what changed since the last visit, recorded for the next one
  if (snapshot) {
    for (const [key, sig] of Object.entries(nextSnapshot)) {
      if (snapshot[key] !== undefined && snapshot[key] !== sig) changed.add(key);
    }
    snapshot = null;
    for (const [key, card] of cards) card.el.querySelector(".card-dot").hidden = !changed.has(key);
  }
  writeSnapshot(repoRoot, nextSnapshot);
  firstPaint = false;
}

/* ═══ overview — four answers, all from the derived API state ═══════════ */
let overviewSignature = "";

function renderOverview(state) {
  const project = state.project || {};
  const recordOrigin = state.record_origin;
  const frontier = state.frontier || [];
  const epics = state.epics || [];
  const stories = state.stories || [];
  const byKey = new Map(stories.map(story => [story.key, story]));
  const relevant = {
    project: state.project,
    record_origin: state.record_origin,
    frontier: state.frontier,
    epics: state.epics,
    stories: stories.map(story => ({
      key: story.key, title: story.title, state: story.state, epic: story.epic,
      blocked_by: story.blocked_by, unblocks: story.unblocks,
    })),
  };
  const nextSignature = JSON.stringify(relevant);
  if (nextSignature === overviewSignature) return;
  overviewSignature = nextSignature;

  const projectSections = Object.entries(project.sections || {});
  // A shallow clone records a null count (it cannot be trusted). Still show
  // the boundary — just without a number it would be lying about.
  const recordBoundary = !recordOrigin ? ""
    : Number.isInteger(recordOrigin.preceding_commits)
      ? `<p class="record-boundary">record begins here; ${esc(recordOrigin.preceding_commits)} commits precede it</p>`
      : `<p class="record-boundary">record begins here</p>`;
  const projectAnswer = `<h3 class="project-name">${esc(project.name || "Unnamed project")}</h3>
    ${recordBoundary}
    ${projectSections.length
      ? `<div class="project-sections">${projectSections.map(([heading, content]) =>
          `<section class="project-section"><h3>${esc(heading)}</h3>${md(content)}</section>`
        ).join("")}</div>`
      : `<p class="overview-empty">No project brief yet. Ask for one before sign-off —
          it refuses until every required heading is captured.</p>`}`;

  const frontierStories = frontier.map(item =>
    typeof item === "string" ? (byKey.get(item) || {key: item}) : item);
  const frontierAnswer = `<p class="frontier-count"><strong>${frontier.length}</strong> ${
      frontier.length === 1 ? "story can" : "stories can"} start now in <strong>${frontier.length}</strong> ${
      frontier.length === 1 ? "worktree" : "worktrees"} — one story per worktree.</p>
    ${frontierStories.length
      ? `<ul class="overview-list">${frontierStories.map(story => `<li>${overviewStoryButton(story, "", "frontier")}</li>`).join("")}</ul>`
      : `<p class="overview-empty">${emptyFrontierReason(stories)}</p>`}`;

  const epicAnswer = epics.length
    ? `<div class="epic-deliveries">${epics.map(epic => `<section class="epic-delivery">
        ${kindLabel("EPIC")}<h3>${esc(epic.title || epic.id)}</h3>
        ${md(epic.objective || "No delivery objective recorded.")}
        <div class="epic-stories">${(epic.stories || []).map(esc).join(" · ") || "No stories"}</div>
      </section>`).join("")}</div>`
    : `<p class="overview-empty">No epics yet. They arrive with the roadmap, and can be
        added on their own after sign-off — ask for either.</p>`;

  const epicNames = new Map(epics.map(epic => [epic.id, epic.title || epic.id]));
  const storyAnswer = stories.length
    ? `<ul class="overview-list">${stories.map(story => {
        const requires = story.blocked_by || [];
        const unblocks = story.unblocks || [];
        const position = `${epicNames.get(story.epic) || story.epic || "Backlog"} · ${STATE_WORD[story.state] || story.state}`;
        return `<li class="story-position">${overviewStoryButton(story, position, "stories")}
          <p class="dependency-facts"><b>Requires:</b> ${requires.length ? requires.map(esc).join(", ") : "nothing outstanding"}<br>
          <b>Unblocks:</b> ${unblocks.length ? unblocks.map(esc).join(", ") : "nothing further"}</p></li>`;
      }).join("")}</ul>`
    : `<p class="overview-empty">No stories have been derived yet.</p>`;

  // The board polls, so this rebuild lands mid-interaction. Rebuilding
  // detaches whatever node held focus AND the `opener` the drawer must focus
  // on close — a keyboard user would silently lose their place on every state
  // change. Story buttons are identified by key, so both can be re-bound to
  // the equivalent new node.
  // Identity is (slot, key), not key alone: a frontier story has a button in
  // BOTH sections, so a key-only rebind would jump focus to the other section.
  const identify = node => (node && node.closest
    && node.closest("#overview [data-story-key]")) || null;
  const focused = identify(document.activeElement);
  const openerNode = identify(opener);

  $("overview").innerHTML = `
    <section class="overview-question"><h2>What is this project?</h2><div class="overview-answer">${projectAnswer}</div></section>
    <section class="overview-question"><h2>What can start now?</h2><div class="overview-answer">${frontierAnswer}</div></section>
    <section class="overview-question"><h2>What does each epic deliver?</h2><div class="overview-answer">${epicAnswer}</div></section>
    <section class="overview-question"><h2>Where does each story sit?</h2><div class="overview-answer">${storyAnswer}</div></section>`;
  $("overview").querySelectorAll("[data-story-key]").forEach(button => {
    button.addEventListener("click", () => openDrawer(button.dataset.storyKey, button));
  });

  // Same slot first; fall back to the key alone only if that occurrence is gone.
  const rebind = node => {
    if (!node) return null;
    const key = CSS.escape(node.dataset.storyKey || "");
    const slot = CSS.escape(node.dataset.overviewSlot || "");
    return $("overview").querySelector(
             `[data-story-key="${key}"][data-overview-slot="${slot}"]`)
        || $("overview").querySelector(`[data-story-key="${key}"]`);
  };
  const refocus = rebind(focused);
  if (refocus) refocus.focus();
  const reopener = rebind(openerNode);
  if (reopener) opener = reopener;
}

// `slot` disambiguates the two places one story can appear: a frontier story
// is rendered under both "What can start now?" and "Where does each story
// sit?", so key alone cannot identify WHICH button had focus.
// An empty frontier has four distinct causes and they are not interchangeable:
// no stories at all, everything shipped, work already in progress, or genuine
// dependency blocking. Saying "waiting on another" for a story that is ACTIVE
// tells the reader to go finish a dependency that does not exist.
function emptyFrontierReason(stories) {
  if (!stories.length) {
    return `No stories yet. Confirm your specs, then ask for the roadmap —
            stories are derived from them, never hand-written.`;
  }
  const unfinished = stories.filter(story => story.state !== "shipped");
  if (!unfinished.length) {
    return `Every story is shipped. Ask for the next one when you are ready.`;
  }
  const building = unfinished.filter(story => story.state === "building").length;
  const blocked = unfinished.filter(story => story.state === "blocked").length;
  const parts = [];
  if (building) {
    parts.push(`${building} ${building === 1 ? "story is" : "stories are"} already building`);
  }
  if (blocked) {
    parts.push(`${blocked} ${blocked === 1 ? "is" : "are"} blocked by a dependency`);
  }
  return parts.length
    ? `Nothing new can start — ${parts.join(", and ")}.`
    : `Nothing can start right now.`;
}

function overviewStoryButton(story, position, slot) {
  return `<button class="overview-story" type="button" data-story-key="${esc(story.key)}" data-overview-slot="${esc(slot)}">
    ${kindLabel("STORY")}<span class="key">${esc(story.key)}</span><span class="title">${esc(story.title || "Untitled story")}</span>
    ${position ? `<span class="position">${esc(position)}</span>` : ""}</button>`;
}

function showBoardView(view) {
  if (view !== "overview" && view !== "lifecycle") return;
  document.body.dataset.view = view;
  $("overview-view").hidden = view !== "overview";
  $("lifecycle-view").hidden = view !== "lifecycle";
  $("lifecycle-controls").hidden = view !== "lifecycle";
  $("lifecycle-footer").hidden = view !== "lifecycle";
  document.querySelectorAll("[data-board-view]").forEach(button => {
    button.setAttribute("aria-selected",
                        String(button.dataset.boardView === view));
  });
}

document.querySelectorAll("[data-board-view]").forEach(button => {
  button.addEventListener("click", () => showBoardView(button.dataset.boardView));
});

/* ═══ overlays — drawer and library share the shell ═════════════════════ */
let openPanel = null, opener = null;
const FOCUSABLE = 'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])';

function showPanel(panel, returnTo) {
  if (openPanel && openPanel !== panel) hidePanel(true);
  opener = returnTo || opener;
  openPanel = panel;
  panel.hidden = false;
  $("scrim").hidden = false;
  // Freeze the page behind the panel: only the panel scrolls (one scrollbar).
  document.body.classList.add("panel-open");
  requestAnimationFrame(() => { panel.classList.add("open"); $("scrim").classList.add("open"); });
  const first = panel.querySelector(FOCUSABLE);
  if (first) first.focus();
}

function hidePanel(immediate) {
  const panel = openPanel;
  if (!panel) return;
  openPanel = null;
  panel.classList.remove("open");
  $("scrim").classList.remove("open");
  const settle = () => {
    if (openPanel === panel) return;   // reopened mid-transition
    panel.hidden = true;
    $("scrim").hidden = openPanel === null;
    if (openPanel === null) document.body.classList.remove("panel-open");
  };
  if (immediate || REDUCE.matches) settle(); else setTimeout(settle, 220);
  $("library-open").setAttribute("aria-expanded", "false");
  if (opener && document.body.contains(opener)) opener.focus();
  opener = null;
}

function trapFocus(event) {
  if (!openPanel) return;
  if (event.key === "Escape") { event.preventDefault(); hidePanel(); return; }
  if (event.key !== "Tab") return;
  const items = [...openPanel.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null);
  if (!items.length) { event.preventDefault(); return; }
  const first = items[0], last = items[items.length - 1];
  const active = document.activeElement;
  if (event.shiftKey && (active === first || !openPanel.contains(active))) {
    event.preventDefault(); last.focus();
  } else if (!event.shiftKey && active === last) {
    event.preventDefault(); first.focus();
  }
}
addEventListener("keydown", trapFocus);
$("scrim").addEventListener("click", () => hidePanel());

/* ═══ drawer ════════════════════════════════════════════════════════════ */
const drawer = {key: null, detail: null, wide: false, tab: "plan", raw: false};

function railBlock(story) {
  const flags = stationFlags(story);
  return `<div class="rail">${flags.map((s, i) => `<div class="st ${s.flag}">
      <i aria-hidden="true">${FLAG_GLYPH[s.flag]}</i>
      <b>${STATIONS[i]}</b>
      <small>${esc(s.note)}</small>
    </div>`).join("")}</div>`;
}

/** Ids behind a disclosure. Sixteen decision slugs inline is the wall of
    text this board exists to stop printing. */
function detailList(items) {
  if (!items || !items.length) return "";
  return `<details class="ids"><summary>${plural(items.length, "id")}</summary>
    <div>${items.map(esc).join("<br>")}</div></details>`;
}

function readinessBlock(detail) {
  const checks = detail.readiness || [];
  if (!checks.length) return "";
  const blockers = checks.filter(c => !c.ok);
  return `<h3>${blockers.length
      ? `${plural(blockers.length, "blocker")} before approval`
      : "Clear for approval"}</h3>
    <div class="checks">${checks.map(c => `<div class="check ${c.ok ? "" : "no"}">
      <em aria-hidden="true">${c.ok ? "✓" : "✗"}</em>
      <span>${esc(c.label)}${c.ok ? "" : `${detailList(c.detail)}<span class="fix">${esc(c.fix)}</span>`}</span>
    </div>`).join("")}</div>
    <p class="check-note">Approval happens in chat — the grill is an interrogation bound to
      the exact plan text, not a button.</p>`;
}

function taskBlock(story) {
  const tasks = story.tasks || [];
  if (!tasks.length) {
    return `<p class="quiet">${(story.lifecycle || {}).planned
      ? "Planned, no tasks recorded yet — they appear once the decomposition is recorded."
      : "Tasks appear after this story is planned and decomposed."}</p>`;
  }
  const mark = {done: "✓", active: "◐", grilled: "●", ready: "◌", skeleton: "○"};
  return `<ul class="tasks">${tasks.map(t => {
    const state = t.state || (t.status === "pending" ? "skeleton" : t.status);
    const cls = state === "done" ? "done" : (state === "active" ? "active" : "");
    // State badge on the LEFT (after the glyph) so it lines up across rows.
    const head = `<em aria-hidden="true">${mark[state] || "○"}</em>
      <span class="task-state">${esc(state || "skeleton")}</span>
      ${kindLabel("TASK")}<span class="id">${esc(t.id || "")}</span><span class="task-title">${esc(t.title || "")}</span>`;
    // A task with no recorded detail stays a plain row: a disclosure that opens
    // onto nothing is worse than no disclosure.
    const detail = taskDossier(t);
    return detail
      ? `<li class="${cls}"><details><summary>${head}</summary>${detail}</details></li>`
      : `<li class="${cls}">${head}</li>`;
  }).join("")}</ul>`;
}

/** What this task was for, what the plan said, and what proves it ran. */
function taskDossier(t) {
  const rows = [];
  if (t.objective) rows.push(`<p class="task-objective">${esc(t.objective)}</p>`);
  if ((t.acceptance_criteria || []).length) {
    rows.push(`<div class="task-ac"><h5>Done when</h5><ul>${
      t.acceptance_criteria.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>`);
  }
  if (t.plan_excerpt) {
    rows.push(`<div class="task-plan"><h5>From the plan</h5>${md(t.plan_excerpt)}</div>`);
  }
  const proof = t.proof || {};
  const bits = [];
  if (proof.spec) bits.push(`<div><b>Spec</b> ${openFile(proof.spec)}</div>`);
  if ((proof.required_tests || []).length) {
    const covered = new Set(proof.covered_tests || []);
    bits.push(`<div><b>Tests</b> ${proof.required_tests.map(name =>
      `<span class="${covered.has(name) ? "ran" : "unproven"}">${
        covered.has(name) ? "✓" : "○"} ${esc(name)}</span>`).join(" ")}</div>`);
  }
  if (proof.verify_ok) {
    bits.push(`<div><b>Verify</b> passed${proof.verify_at
      ? ` · ${esc(String(proof.verify_at).slice(0, 10))}` : ""}</div>`);
  }
  if (proof.grill) {
    bits.push(`<div><b>Grill</b> <span class="verdict ${
      proof.grill.verdict === "pass" ? "ok" : "bad"}">${
      esc(proof.grill.verdict || "not recorded")}</span> · ${
      esc(t.grill_freshness || "missing")}</div>`);
  } else if (t.grill_freshness) {
    bits.push(`<div><b>Grill</b> ${esc(t.grill_freshness)}</div>`);
  }
  if (t.budget) {
    bits.push(`<div><b>Budget</b> ${esc(t.budget.used.files)}/${
      esc(t.budget.limit.files)} files · ${esc(t.budget.used.lines)}/${
      esc(t.budget.limit.lines)} lines</div>`);
  }
  if ((t.write_scope || []).length) {
    bits.push(`<div><b>Scope</b> ${t.write_scope.map(p =>
      `<code>${esc(p)}</code>`).join(" ")}</div>`);
  }
  if (t.started_at) {
    bits.push(`<div><b>Worked</b> ${esc(String(t.started_at).slice(0, 10))}${
      t.completed_at ? ` → ${esc(String(t.completed_at).slice(0, 10))}` : " → in progress"}</div>`);
  }
  if (bits.length) rows.push(`<div class="task-proof"><h5>Proof</h5>${bits.join("")}</div>`);
  (proof.findings || []).forEach(f => rows.push(
    `<div class="finding note">${esc(f.aspect)}: ${esc(f.summary)}</div>`));
  if (t.reviewer_focus) {
    rows.push(`<div class="task-focus"><h5>Reviewer focus</h5><p>${
      esc(t.reviewer_focus)}</p></div>`);
  }
  return rows.join("");
}

function findingList(items, cls) {
  if (!items || !items.length) return "";
  return items.map(f => {
    const text = typeof f === "string" ? f
      : [f.category, f.area, f.summary].filter(Boolean).join(" · ");
    return `<div class="finding ${cls}">${esc(text)}</div>`;
  }).join("");
}

function proofBlock(detail) {
  const ev = detail.evidence || {};
  const rows = [];
  rows.push(["verify", ev.verify
    ? `<span class="verdict ${ev.verify.ok ? "ok" : "bad"}">${ev.verify.ok ? "✓ passed" : "✗ failed"}</span>`
    : `<span class="verdict none">not recorded</span>`]);
  rows.push(["tests", ev.tests
    ? esc(Object.keys(ev.tests).join(", "))
    : `<span class="verdict none">not recorded</span>`]);
  for (const [aspect, review] of Object.entries(ev.reviews || {})) {
    rows.push([aspect, review
      ? `<span class="verdict ${review.score >= 8 ? "ok" : "bad"}">${esc(review.score)}/10</span>
         ${esc(review.summary || "")}
         ${findingList(review.blocking_findings, "")}
         ${findingList(review.non_blocking_findings, "minor")}`
      : `<span class="verdict none">not recorded</span>`]);
  }
  for (const [gate, grill] of Object.entries(ev.grills || {})) {
    rows.push([`grill:${gate}`, grill
      ? `<span class="verdict ${grill.verdict === "pass" ? "ok" : "bad"}">${esc(grill.verdict)}</span>`
      : `<span class="verdict none">not recorded</span>`]);
  }
  const d = ev.decomposition;
  const decomposition = d
    ? `<h3>Decomposition</h3><dl class="kv">
         <dt>user facing</dt><dd>${d.user_facing ? "yes" : "no"}</dd>
         <dt>recorded by</dt><dd>${esc(d.generated_by || "")}</dd>
         <dt>tasks</dt><dd>${(d.tasks || []).length}</dd>
       </dl>
       <div class="dtasks">${(d.tasks || []).map(t =>
         `<div class="dtask">${kindLabel("TASK")}<span class="id">${esc(t.id || "")}</span>
          <span class="dtask-title">${esc(t.title || t.summary || "")}</span></div>`).join("")}</div>`
    : `<h3>Decomposition</h3><p class="quiet">Not recorded yet — it is written when the approved
       plan is broken into bounded tasks.</p>`;
  return `<h3>Gate evidence</h3><dl class="kv">${rows.map(([k, v]) =>
    `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>${decomposition}`;
}

const RAW_SOURCE = {
  plan: (d) => ({path: d.plan && d.plan.path, frontmatter: d.plan, body: d.plan_body}),
  spec: (d) => d.spec,
  proof: (d) => ({verify: (d.evidence || {}).verify, tests: (d.evidence || {}).tests,
                  reviews: (d.evidence || {}).reviews, grills: (d.evidence || {}).grills,
                  task_grills: (d.evidence || {}).task_grills,
                  decomposition: (d.evidence || {}).decomposition}),
};

function drawerBreadcrumb(detail) {
  const project = detail.project || {};
  const epic = detail.epic || null;
  const story = detail.story || {};
  const epicName = epic && (epic.title || epic.id);
  const segments = [
    {label: "Project", value: project.name || "Unnamed project"},
    ...(epicName ? [{label: "Epic", value: epicName}] : []),
    {label: "Story", value: story.title || story.key || drawer.key},
  ];
  return `<nav class="breadcrumb" aria-label="Story hierarchy">${segments.map((segment, index) =>
    `${index ? '<span class="sep" aria-hidden="true">›</span>' : ""}<span><b>${esc(segment.label)}</b>${esc(segment.value)}</span>`
  ).join("")}</nav>`;
}

function drawerBody() {
  const detail = drawer.detail;
  if (!detail) return `<p class="quiet">Loading…</p>`;
  // The live story carries lifecycle/state/tasks; the detail carries artifacts.
  const s = liveStory(drawer.key) || detail.story || {};
  if (drawer.wide) {
    if (drawer.raw) return `<div class="tabs">${tabBar()}</div>${rawBlock(RAW_SOURCE[drawer.tab](detail))}`;
    let content;
    if (drawer.tab === "plan") {
      content = detail.plan_body
        ? openFile(detail.plan && detail.plan.path) + md(detail.plan_body)
        : `<p class="quiet">No plan saved for this story yet —
           <code>forge.py plan save --from &lt;plan-file&gt;</code>.</p>`;
    } else if (drawer.tab === "spec") {
      content = detail.spec
        ? openFile(detail.spec.path) + md(stripFrontmatter(detail.spec.body))
        : `<p class="quiet">This story has no spec linked.</p>`;
    } else {
      content = proofBlock(detail);
    }
    return `<div class="tabs">${tabBar()}</div>${content}`;
  }
  const days = ageDays(detail.plan && detail.plan.saved);
  const age = days !== null && s.state !== "shipped"
    ? ` · plan saved ${days === 0 ? "today" : plural(days, "day") + " ago"}` : "";
  const blocked = s.state === "blocked" && (s.blocked_by || []).length
    ? `<p class="statline">⊘ blocked by <b>${(s.blocked_by || []).map(esc).join(", ")}</b></p>` : "";
  const shippedPr = s.state === "shipped" && s.pr_link
    ? `<p class="statline">PR ${prReference(s)}</p>` : "";
  return `${drawerBreadcrumb(detail)}
    <h2 id="drawer-title"><span class="k">${esc(s.key || drawer.key)}</span>${esc(s.title || "")}</h2>
    <p class="statline">${STATE_GLYPH[s.state] || "·"} <b>${esc(STATE_WORD[s.state] || s.state || "")}</b>${esc(age)}</p>
    ${blocked}
    ${shippedPr}
    <h3>Gate rail</h3>${railBlock(s)}
    ${readinessBlock(detail)}
    <h3>Tasks</h3>${taskBlock(detail.tasks ? detail : s)}
    <button class="widen" type="button" data-widen="1">Read plan, spec and proof ›</button>`;
}

function tabBar() {
  return ["plan", "spec", "proof"].map(t =>
    `<button type="button" data-tab="${t}" aria-selected="${t === drawer.tab}">${t}</button>`).join("")
    + `<span class="spacer"></span>
       <button type="button" class="raw" data-raw="1" aria-selected="${drawer.raw}">raw json</button>`;
}

function liveStory(key) {
  const list = (lastState && lastState.stories) || [];
  return list.find(s => s.key === key) || null;
}

function paintDrawer() {
  const panel = $("drawer");
  panel.classList.toggle("wide", drawer.wide);
  panel.innerHTML = `<div class="panel-head">
      ${drawer.wide
        ? `<button class="ghost" type="button" data-narrow="1">‹ Back</button>`
        : `<span class="panel-eyebrow">Story</span>`}
      ${drawer.wide ? `<span class="panel-eyebrow">${esc(drawer.key)}</span>` : ""}
      <button class="ghost" type="button" data-close="1">Close ✕</button>
    </div>
    <div class="panel-body">${drawerBody()}</div>`;
  if (!panel.querySelector("#drawer-title")) {
    panel.querySelector(".panel-eyebrow").id = "drawer-title";
  }
  panel.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => hidePanel()));
  const widen = panel.querySelector("[data-widen]");
  if (widen) widen.addEventListener("click", () => { drawer.wide = true; paintDrawer(); refocus("[data-narrow]"); });
  const narrow = panel.querySelector("[data-narrow]");
  if (narrow) narrow.addEventListener("click", () => { drawer.wide = false; paintDrawer(); refocus("[data-widen]"); });
  panel.querySelectorAll("[data-tab]").forEach(b =>
    b.addEventListener("click", () => {
      drawer.tab = b.dataset.tab; paintDrawer(); refocus(`[data-tab="${b.dataset.tab}"]`);
    }));
  const raw = panel.querySelector("[data-raw]");
  if (raw) raw.addEventListener("click", () => { drawer.raw = !drawer.raw; paintDrawer(); refocus("[data-raw]"); });
}

// innerHTML replaces the control that was just clicked, so hand focus to
// its successor rather than dropping the keyboard user back on <body>.
function refocus(selector) {
  const el = $("drawer").querySelector(selector) || $("drawer").querySelector(FOCUSABLE);
  if (el) el.focus();
}

async function openDrawer(key, fromEl) {
  drawer.key = key;
  drawer.wide = false;
  drawer.tab = "plan";
  drawer.raw = false;
  // Seed from the already-loaded board state so the drawer paints its gate
  // rail, status and tasks INSTANTLY on click; the fetch only fills in the
  // readiness checks and the plan/spec/proof artifacts.
  const live = liveStory(key);
  drawer.detail = live ? {story: live, readiness: [], evidence: {}, tasks: live.tasks || []} : null;
  paintDrawer();
  showPanel($("drawer"), fromEl || null);
  try {
    const res = await fetch(`/api/story/${encodeURIComponent(key)}`, {cache: "no-store"});
    const detail = await res.json();
    if (detail.error) throw new Error(detail.error);
    if (drawer.key !== key) return;
    drawer.detail = detail;
  } catch {
    if (drawer.key !== key) return;
    drawer.detail = {story: liveStory(key) || {key}, readiness: [], evidence: {}};
  }
  paintDrawer();
}

/* ═══ library — reference material, consulted rarely ════════════════════ */
function libraryBody(state) {
  const specs = state.specs || [];
  const decisions = state.decisions || [];
  const plans = state.plans || {};
  // The ledger holds closed windows; an open one lives in `quickfix`.
  const quickfixes = (state.quickfix ? [state.quickfix] : [])
    .concat([...(state.quickfix_ledger || [])].reverse());
  const sp = (state.summary || {}).specs || {};
  const specRows = specs.length
    ? `<div class="ledger">${specs.map(s => `<div>
        <span class="id">${esc(s.slug || "")}</span>
        <span>${esc(s.title || "")}</span>
        <span class="tag ${esc(s.status || "draft")}">${esc(s.status || "draft")}</span>
        ${openFile(s.path)}
      </div>`).join("")}</div>
      ${(sp.unreferenced || []).length
        ? `<p class="quiet">Unreferenced by any story: ${sp.unreferenced.map(esc).join(", ")}</p>` : ""}`
    : `<p class="quiet">No specs saved. Save the first capability while you prototype it.</p>`;
  const planRows = (loc) => (plans[loc] || []).map(p => `<div>
      <span class="id">${esc(p.story || p.issue || "")}</span>
      <span class="meta">saved ${esc((p.saved || "").slice(0, 10))}</span>
      ${openFile(p.path)}
    </div>`).join("");
  const active = planRows("active"), completed = planRows("completed");
  return `<h3>Specs <span class="meta">${specs.length}</span></h3>${specRows}
    <h3>Active decisions <span class="meta">${decisions.length}</span></h3>
    ${decisions.length
      ? `<div class="ledger">${decisions.map(d => `<div>
          <span class="id">${esc(d.id)}</span><span>${esc(d.title)}</span>${openFile(d.path)}
        </div>`).join("")}</div>`
      : `<p class="quiet">No accepted decisions yet. They are recorded when you confirm one in chat.</p>`}
    <h3>Plans ledger</h3>
    ${active ? `<p class="quiet">Active</p><div class="ledger">${active}</div>` : ""}
    ${completed ? `<p class="quiet">Completed</p><div class="ledger">${completed}</div>` : ""}
    ${!active && !completed ? `<p class="quiet">No plans saved yet.</p>` : ""}
    <h3>Quickfix windows</h3>
    ${quickfixes.length
      ? `<div class="ledger">${quickfixes.map(q => `<div>
          <span class="id">${esc(q.id || "")}</span><span>${esc(q.reason || "")}</span>
          <span class="meta">${plural((q.files || []).length, "file")}${
            q.completed_at ? ` · closed ${esc(q.completed_at.slice(0, 10))}` : " · open now"}</span>
        </div>`).join("")}</div>`
      : `<p class="quiet">No quickfix window recorded.</p>`}`;
}

function openLibrary() {
  const panel = $("library");
  panel.innerHTML = `<div class="panel-head">
      <span class="panel-eyebrow" id="library-title">Library — reference</span>
      <button class="ghost" type="button" data-close="1">Close ✕</button>
    </div>
    <div class="panel-body">${libraryBody(lastState || {})}</div>`;
  panel.querySelector("[data-close]").addEventListener("click", () => hidePanel());
  $("library-open").setAttribute("aria-expanded", "true");
  showPanel(panel, $("library-open"));
}
$("library-open").addEventListener("click", () => {
  if (openPanel === $("library")) hidePanel(); else openLibrary();
});

/* ═══ poll ══════════════════════════════════════════════════════════════ */
let lastState = null, lastOk = 0;

function render(state) {
  const firstEver = lastState === null;
  lastState = state;
  repoRoot = state.root || "";
  if (firstEver) snapshot = readSnapshot(repoRoot);
  renderRunline(state);
  renderProgress(state);
  renderBanner(state);
  renderNext(state);
  renderColhead();
  patchLanes(state);
  renderOverview(state);
  if (firstEver) requestAnimationFrame(() => $("bar").classList.add("animate"));
}

async function poll() {
  try {
    const res = await fetch("/api/state", {cache: "no-store"});
    if (!res.ok) throw new Error(String(res.status));
    const state = await res.json();
    render(state);
    lastOk = Date.now();
    // Cache for a warm start on the next load.
    try { localStorage.setItem("forge-board:laststate", JSON.stringify(state)); } catch { /* private mode */ }
  } catch { /* staleness shows in the tick */ }
}

function tick() {
  const el = $("tick"), label = $("tick-label");
  if (!lastOk) { label.textContent = "connecting"; return; }
  const secs = Math.round((Date.now() - lastOk) / 1000);
  const stale = secs > 15;
  el.classList.toggle("stale", stale);
  label.textContent = stale ? `stale ${secs}s — is \`./forge board\` still running?` : "live";
}

// #STORY-KEY opens that story — the skill deep-links straight to a card.
const deepLink = () => {
  const raw = location.hash.replace(/^#/, "");
  // A hash the user typed by hand can be malformed ("#100%"); a URIError here
  // would take down the poll chain and the hashchange listener with it.
  try { return decodeURIComponent(raw); } catch { return raw; }
};
function followHash() {
  const key = deepLink();
  if (!key) return;
  const card = cards.get(key);
  const overviewButton = [...$("overview").querySelectorAll("[data-story-key]")]
    .find(button => button.dataset.storyKey === key);
  const target = document.body.dataset.view === "overview" ? overviewButton : card && card.el;
  if (!target) return;
  target.scrollIntoView({block: "center", behavior: REDUCE.matches ? "auto" : "smooth"});
  openDrawer(key, target);
}
addEventListener("hashchange", followHash);

// Warm start — paint the last-seen state instantly so a reload isn't blank
// while the first (server-recomputed) /api/state request is in flight.
try {
  const warm = localStorage.getItem("forge-board:laststate");
  if (warm) render(JSON.parse(warm));
} catch { /* ignore a bad cache */ }

poll().then(() => { if (deepLink()) followHash(); });
setInterval(poll, 4000);
setInterval(tick, 1000);
</script>
</body>
