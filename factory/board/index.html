<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Board</title>
<style>
  /* ═══ Editorial ledger ═══════════════════════════════════════════════
     Warm paper, oxblood accent, three typefaces with one job each.
     Position carries progress; colour never carries state alone — every
     station and card also shows a glyph or a word. */
  /* Same warm palette; structure is now card-driven and every surface is
     SOLID — no wash, gradient, or translucency, so nothing reads as shaky. */
  :root {
    --paper:   #faf8f4;
    --surface: #fffdfa;   /* card face — solid */
    --surface-2: #f2eee6; /* inset / segmented track — solid */
    --ink:     #1a1714;
    --muted:   #6f675e;   /* readable secondary — --stone is for marks */
    --faint:   #948b80;   /* labels, hairline text */
    --accent:  #8c2f39;   /* oxblood */
    --accent-ink: #fffdfa;/* text on an accent fill */
    --shipped: #2f6b4f;   /* forest */
    --build:   #3b4c8a;   /* indigo */
    --ready:   #a8741a;   /* ochre  */
    --stone:   #9a938a;
    --rule:    #1a17141f; /* hairline, ink @ 12% */
    --wash:    #1a17140a;
    --tint:    #8c2f390f;
    --shadow-sm: 0 1px 2px #1a17140f, 0 1px 3px #1a171412;
    --shadow:  0 1px 2px #1a17140f, 0 12px 32px #1a171418;
    --scroll:  #1a171433;
    --scroll-hi: #1a17145c;
    --radius:  8px;   /* one card radius everywhere */
    --radius-sm: 8px;

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans:  system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:  ui-monospace, "SF Mono", Consolas, monospace;

    --enter: cubic-bezier(.32,.72,0,1);
    --gutter: clamp(.75rem, 2.2vw, 1.75rem);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:   #16140f;
      --surface: #1e1b15;
      --surface-2: #26221a;
      --ink:     #f0ece4;
      --muted:   #a49b8d;
      --faint:   #8a8073;
      --accent:  #d4707a;
      --accent-ink: #16140f;
      --shipped: #5fa37e;
      --build:   #8296d8;
      --ready:   #d9a441;
      --stone:   #6b6459;
      --rule:    #f0ece424; /* cream @ 14% */
      --wash:    #f0ece40a;
      --tint:    #d4707a14;
      --shadow-sm: 0 1px 2px #00000059;
      --shadow:  0 1px 2px #00000059, 0 14px 36px #00000066;
      --scroll:  #f0ece42e;
      --scroll-hi: #f0ece457;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  /* Slim, styled scrollbars so you can gauge how much content remains. Space
     is RESERVED (scrollbar-gutter: stable) so the column ruler never shifts. */
  * { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb {
    background: var(--scroll); border-radius: 999px;
    border: 3px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hi); background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  /* author `display` on #banner/.bar/.panel would otherwise outrank the UA
     rule for [hidden]; state the intent once instead of per selector. */
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }
  body {
    background: var(--paper); color: var(--ink);
    font: 14px/1.5 var(--sans);
    overflow-x: hidden;
  }
  /* When a side panel is open the page behind it is frozen — one scrollbar. */
  body.panel-open { overflow: hidden; }
  :focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px;
  }
  button { font: inherit; color: inherit; background: none; border: 0; }
  code, .mono { font-family: var(--mono); }
  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: var(--gutter); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ── header ───────────────────────────────────────────────────────── */
  /* Solid bar — no blur, no translucency; it sits flat on the paper. */
  #topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper); border-bottom: 1px solid var(--rule);
    padding-block: .85rem .7rem;
  }
  .masthead { display: flex; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; }
  .wordmark {
    display: inline-flex; align-items: center; gap: .55rem;
    font: 400 1.18rem/1.1 var(--serif); letter-spacing: .005em; white-space: nowrap;
  }
  .wordmark::before {
    content: "◆"; width: 27px; height: 27px; flex: none; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: .74rem; color: var(--accent-ink); background: var(--accent);
  }
  .wordmark em { font-style: normal; color: var(--accent); }
  #runline { color: var(--muted); font-size: .78rem; flex: 1; min-width: 10rem;
             display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
  #runline b { color: var(--ink); font-weight: 600; }
  #runline b.key {
    font-family: var(--mono); font-size: .72rem; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--rule);
    padding: .1rem .45rem; border-radius: 999px;
  }
  .masthead-right { display: flex; align-items: center; gap: .8rem; margin-left: auto; }
  .tick {
    display: inline-flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .74rem;
    padding: .28rem .6rem; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--rule);
  }
  .tick i { width: 7px; height: 7px; border-radius: 50%; background: var(--shipped); flex: none; }
  .tick.stale { color: var(--accent); }
  .tick.stale i { background: var(--accent); border-radius: 1px; }
  .ghost {
    font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
    color: var(--muted); cursor: pointer; padding: .38rem .72rem; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--rule);
    transition: color 140ms ease-out, background-color 140ms ease-out,
                border-color 140ms ease-out, transform 110ms ease-out;
  }
  .ghost:hover { color: var(--ink); border-color: var(--muted); }
  .ghost:active { transform: scale(.98); }

  /* Board views — a solid segmented pill control. */
  .board-views {
    display: inline-flex; align-items: center; gap: .15rem; margin-top: .8rem;
    padding: .22rem; background: var(--surface-2);
    border: 1px solid var(--rule); border-radius: 999px; width: max-content;
  }
  .board-view {
    cursor: pointer; padding: .4rem .95rem; border-radius: 999px;
    color: var(--muted); font-size: .72rem; font-weight: 600; letter-spacing: .02em;
    transition: color 140ms ease-out, background-color 140ms ease-out, box-shadow 140ms ease-out;
  }
  .board-view:hover { color: var(--ink); }
  .board-view:active { transform: scale(.98); }
  .board-view[aria-selected="true"] {
    color: var(--ink); background: var(--surface); box-shadow: var(--shadow-sm);
  }

  /* Lifecycle status card — holds the progress bar and the "what now" line. */
  .controls-card {
    margin-top: .8rem; padding: .85rem 1rem;
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
  }
  /* progress */
  .progress { margin-top: 0; }
  .bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--rule); }
  .bar i { display: block; min-width: 0; }
  .bar.animate i { transition: width 420ms var(--enter); }
  .bar i.shipped  { background: var(--shipped); }
  .bar i.building { background: var(--build); }
  .bar i.ready    { background: var(--ready); }
  .bar i.blocked  { background: var(--stone); }
  .bar i.waiting  { background: var(--muted); }
  .progress-line { margin-top: .38rem; font-size: .78rem; color: var(--muted); }
  .progress-line b { color: var(--ink); font-weight: 600; }
  .progress-line span { white-space: nowrap; }
  .progress-line span + span::before { content: " · "; color: var(--stone); }
  .progress-line em { font-style: normal; margin-right: .28em; }
  .k-shipped  { color: var(--shipped); }
  .k-building { color: var(--build); }
  .k-ready    { color: var(--ready); }
  .k-blocked  { color: var(--muted); }
  .k-waiting  { color: var(--muted); }

  /* banner — urgent only, hidden when empty */
  #banner { margin-top: .55rem; display: grid; gap: .3rem; }
  .flag {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .7rem;
    font-size: .8rem; padding: .5rem .7rem;
    border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--surface-2);
  }
  .flag.urgent { background: var(--tint); }
  .flag em { font-style: normal; color: var(--accent); }
  .flag b { font-weight: 600; }
  .flag code, .flag .do { font-size: .72rem; color: var(--muted); }

  /* next */
  .next { margin-top: .55rem; }
  .next-head {
    display: flex; align-items: baseline; gap: .55rem; width: 100%;
    cursor: pointer; text-align: left; padding: .3rem 0;
    transition: opacity 140ms ease-out;
  }
  .next-head:hover { opacity: .78; }
  .next-head:active { transform: scale(.995); }
  .next-label {
    font-size: .66rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--accent); flex: none;
  }
  .next-verb {
    font: .88rem/1.35 var(--serif); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .next-count { font-size: .72rem; color: var(--muted); flex: none; }
  .next-count::after { content: " ▾"; display: inline-block; transition: transform 180ms var(--enter); }
  .next-head[aria-expanded="true"] .next-count::after { transform: rotate(180deg); }
  .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 180ms var(--enter); }
  .collapse > div { overflow: hidden; min-height: 0; }
  .collapse.open { grid-template-rows: 1fr; }
  .next ol { margin: .1rem 0 .5rem; padding-left: 1.4rem; font-size: .82rem; color: var(--muted); }
  .next li { margin: .18rem 0; }
  .next li code { font-family: var(--mono); font-size: .74rem; color: var(--ink); }
  .next li b { color: var(--ink); }

  /* column header — the ruler the whole board reads against */
  .colhead {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0 .5rem; margin-top: .5rem;
  }
  .colhead > div {
    /* Inset to match a card's text: its 2px rule plus .5rem padding. The
       ruler has to sit exactly over the keys it labels. */
    padding: .42rem .1rem .38rem calc(2px + .5rem);
    font-size: .64rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); min-width: 0;
    display: flex; align-items: baseline; gap: .35rem;
  }
  .colhead > div.bottleneck { color: var(--accent); }
  .colhead .bn { font-size: .58rem; letter-spacing: .06em; opacity: .95; }

  /* ── overview ─────────────────────────────────────────────────────── */
  main { padding-block: .4rem 4rem; }
  .overview { display: grid; gap: 0; }
  /* Single-column grid: the question stacks ABOVE its answer (row 1 / row 2),
     so the answer uses the full width with no empty side column. */
  .overview-question {
    display: grid; grid-template-columns: minmax(0, 1fr);
    padding: clamp(1.2rem, 2.6vw, 2rem) 0;
  }
  .overview-question > h2 {
    font: 400 clamp(1.15rem, 2vw, 1.5rem)/1.2 var(--serif);
    letter-spacing: .005em; color: var(--accent); margin-bottom: 1rem;
  }
  .overview-answer { min-width: 0; }
  .project-name {
    font: 400 clamp(1.45rem, 3vw, 2.35rem)/1.08 var(--serif);
    color: var(--accent); margin-bottom: .8rem;
  }
  .record-boundary {
    margin: -.35rem 0 .8rem; color: var(--muted); font: .7rem/1.4 var(--mono);
  }
  /* Every section is one full-width solid card — consistent, no ragged
     side-by-side heights. Long prose flows into two columns so the width is
     used (34em cap lifted) and lines stay a comfortable length. */
  .project-sections { display: grid; grid-template-columns: 1fr; gap: .8rem; }
  .project-section {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); padding: 1.05rem 1.2rem;
  }
  /* Prose uses the full card width as one column — no newspaper split. */
  .project-section .md { max-width: none; }
  .project-section .md > :first-child { margin-top: 0; }
  .project-section h3 {
    font-size: .62rem; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: .3rem;
  }
  .project-section p { font-family: var(--serif); line-height: 1.55; }
  .frontier-count {
    font: 400 clamp(1.15rem, 2vw, 1.5rem)/1.25 var(--serif); margin-bottom: .8rem;
  }
  .frontier-count strong { color: var(--accent); font-weight: 400; }
  .overview-list { list-style: none; display: grid; gap: .5rem; margin: 0; padding: 0; }
  .overview-list li { min-width: 0; }
  .overview-story {
    width: 100%; cursor: pointer; text-align: left; padding: .65rem .8rem;
    border: 1px solid var(--rule);
    background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
    transition: border-color 140ms ease-out, box-shadow 140ms ease-out, transform 110ms ease-out;
  }
  .overview-story:hover { border-color: var(--muted); box-shadow: var(--shadow); }
  .overview-story:active { transform: scale(.99); }
  .overview-story .key { font: 600 .7rem/1 var(--mono); color: var(--accent); margin-right: .45rem; }
  .overview-story .title { font-size: .82rem; }
  .overview-story .position { display: block; margin-top: .32rem; font-size: .72rem; color: var(--muted); }
  .type-label {
    display: inline-block; flex: none; font: 600 .55rem/1 var(--mono);
    letter-spacing: .12em; color: var(--faint);
  }
  .overview-story .type-label { margin-right: .45rem; }
  /* Full-width epic cards, one per row — consistent with the brief cards. */
  .epic-deliveries { display: grid; gap: .8rem; }
  .epic-delivery {
    padding: 1rem 1.2rem; border: 1px solid var(--rule);
    background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
  }
  .epic-delivery .type-label { margin-bottom: .3rem; }
  .epic-delivery h3 { font: 400 1.02rem/1.3 var(--serif); }
  .epic-delivery p { margin-top: .2rem; color: var(--muted); }
  .epic-delivery .md { max-width: none; }
  .epic-stories {
    margin-top: .55rem; padding-top: .5rem; border-top: 1px solid var(--rule);
    font: .68rem/1.5 var(--mono); color: var(--ink);
  }
  /* Each story is ONE full-width card: the clickable story on top, its
     Requires/Unblocks beneath — no bare text floating in empty space. */
  .story-position {
    display: grid; grid-template-columns: 1fr;
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
    transition: border-color 140ms ease-out, box-shadow 140ms ease-out;
  }
  .story-position:hover { border-color: var(--muted); box-shadow: var(--shadow); }
  .story-position .overview-story {
    border: 0; background: none; box-shadow: none; border-radius: 0; padding: .7rem .9rem .45rem;
  }
  .story-position .overview-story:hover { border: 0; background: none; box-shadow: none; }
  .story-position .overview-story:active { transform: none; }
  .dependency-facts {
    font-size: .72rem; color: var(--muted); margin: 0;
    padding: .5rem .9rem .65rem; border-top: 1px solid var(--rule);
  }
  .dependency-facts b { color: var(--ink); font-weight: 600; }
  .overview-empty { color: var(--muted); font-family: var(--serif); }

  /* ── lanes ────────────────────────────────────────────────────────── */
  .lane { padding-block: .1rem .35rem; }
  .lane-head { display: flex; align-items: center; gap: .7rem; padding: .85rem 0 .3rem; }
  .lane-name {
    font: 400 .95rem/1.2 var(--serif); letter-spacing: .01em; flex: none;
    max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* No rule beside the lane name — spacing alone separates lanes now. */
  .lane-rule { flex: 1; }
  .lane-count { flex: none; font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lane-grid {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: .55rem .5rem; align-items: start;
    padding-bottom: 1rem; min-height: 1.6rem;
  }
  .cell { display: grid; gap: .55rem; align-content: start; min-width: 0; }
  /* No tinted background behind the bottleneck column — the column header
     already flags it; a colour bleeding between cards read as inconsistent. */

  /* ── card ─────────────────────────────────────────────────────────── */
  /* Solid surface, uniform hairline border — no coloured edge; state reads
     from the glyph and the mark line. */
  .card {
    display: grid; gap: .16rem; width: 100%; min-width: 0; text-align: left;
    padding: .55rem .65rem; cursor: pointer;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    transition: border-color 140ms ease-out, transform 110ms ease-out,
                box-shadow 200ms ease-out;
  }
  .card:hover { border-color: var(--muted); box-shadow: var(--shadow); }
  .card:active { transform: scale(.98); }
  .card.settling {
    box-shadow: 0 0 0 2px var(--accent), var(--shadow-sm);
    transition: border-color 140ms ease-out, transform 110ms ease-out,
                box-shadow 160ms ease-out;
  }
  .card[data-state="shipped"]  { opacity: .72; }
  .card[data-state="shipped"]:hover, .card[data-state="shipped"]:focus-visible { opacity: 1; }
  .card-top { display: flex; align-items: baseline; gap: .3rem; min-width: 0; }
  .card-glyph { flex: none; font-size: .74rem; line-height: 1; color: var(--stone); }
  .card[data-state="shipped"]  .card-glyph { color: var(--shipped); }
  .card[data-state="building"] .card-glyph { color: var(--build); }
  .card[data-state="ready"]    .card-glyph { color: var(--ready); }
  .card-key {
    font-family: var(--mono); font-size: .7rem; font-weight: 600; letter-spacing: -.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .card-dot {
    flex: none; margin-left: auto; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
  }
  .card-title {
    font-size: .74rem; line-height: 1.3; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-mark { font-size: .66rem; color: var(--accent); letter-spacing: .01em; }
  .card[data-state="blocked"] .card-mark, .card[data-state="waiting"] .card-mark { color: var(--muted); }
  .card-mark:empty { display: none; }

  .empty {
    margin-top: 2rem; padding: 1.4rem 0; border-top: 1px solid var(--rule);
    color: var(--muted); font: .9rem/1.6 var(--serif); max-width: 46rem;
  }
  .empty code { font-family: var(--mono); font-size: .78rem; color: var(--accent); }

  footer {
    color: var(--muted); font-size: .72rem; padding-block: 1.4rem 3rem;
    border-top: 1px solid var(--rule); max-width: 1240px; margin: 0 auto;
  }
  footer code { color: var(--accent); }
  footer p + p { margin-top: .3rem; }

  /* ── overlays ─────────────────────────────────────────────────────── */
  #scrim {
    position: fixed; inset: 0; z-index: 30; background: #1a1714;
    opacity: 0; transition: opacity 220ms ease-out;
  }
  #scrim.open { opacity: .28; }
  @media (prefers-color-scheme: dark) { #scrim.open { opacity: .5; } }

  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
    width: var(--pw, min(100vw, max(520px, 50vw)));
    background: var(--surface); border-left: 1px solid var(--rule);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 220ms var(--enter), width 260ms var(--enter);
  }
  .panel.open { transform: none; }
  /* Every slide-in panel — the story drawer, its plan/spec/proof reading
     state, and the Library — is half the viewport: wide enough for the
     text-heavy reading panes, with a floor for small windows and a cap at the
     viewport on the narrowest. The shared default on .panel is the single
     source of that width, so no panel sets its own. */
  .panel-head {
    display: flex; align-items: center; gap: .6rem;
    padding: .8rem var(--gutter) .55rem; border-bottom: 1px solid var(--rule); flex: none;
  }
  .panel-eyebrow {
    font-size: .64rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .panel-body { overflow: auto; padding: 1rem var(--gutter) 3rem; flex: 1; }
  .panel h2 { font: 400 1.32rem/1.25 var(--serif); letter-spacing: .005em; }
  .panel h2 .k { display: block; font: 600 .74rem/1 var(--mono); color: var(--accent); margin-bottom: .35rem; letter-spacing: .02em; }
  /* Section labels, no rules — the cards below them do the separating. */
  .panel h3 {
    font-size: .64rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); margin: 1.7rem 0 .6rem;
  }
  .panel h3:first-of-type { margin-top: .3rem; }

  .breadcrumb {
    display: flex; flex-wrap: wrap; gap: .3rem; align-items: baseline;
    margin-bottom: .85rem; color: var(--muted); font-size: .7rem;
  }
  .breadcrumb b {
    display: block; font: 600 .52rem/1 var(--mono); letter-spacing: .1em;
    text-transform: uppercase; color: var(--stone); margin-bottom: .15rem;
  }
  .breadcrumb .sep { color: var(--stone); }

  .statline { margin-top: .5rem; font-size: .8rem; color: var(--muted); }
  .statline b { font-weight: 600; }

  /* gate rail — a connected stepper spanning the full width (no box): a filled
     badge is a cleared gate, a ring is one still ahead; the joining line fills
     in behind the work you've done. */
  .rail {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0;
    padding: .5rem 0 .2rem;
  }
  .rail .st {
    position: relative; display: grid; justify-items: center; gap: .5rem;
    text-align: center; min-width: 0; padding-inline: .2rem;
  }
  .rail .st::before {
    content: ""; position: absolute; top: 12px; right: 50%; width: 100%; height: 2px;
    background: var(--rule); z-index: 0;
  }
  .rail .st:first-child::before { display: none; }
  .rail .st.done::before, .rail .st.done + .st::before { background: var(--shipped); }
  .rail .st i {
    position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-style: normal; font-size: .74rem; line-height: 1;
    background: var(--surface); border: 2px solid var(--stone); color: var(--stone);
  }
  .rail .st.done i    { background: var(--shipped); border-color: var(--shipped); color: var(--accent-ink); }
  .rail .st.partial i { background: var(--build);   border-color: var(--build);   color: var(--accent-ink); }
  .rail .st.gap i     { background: var(--accent);   border-color: var(--accent);   color: var(--accent-ink); }
  .rail .st b {
    font-size: .58rem; letter-spacing: .08em; text-transform: uppercase;
    font-weight: 600; color: var(--muted);
  }
  .rail .st.done b, .rail .st.partial b { color: var(--ink); }
  .rail .st small { font-size: .62rem; color: var(--muted); font-family: var(--mono); font-weight: 600; }
  .rail .st small:empty { display: none; }

  /* Approval checklist — one ruled card: a badge + label per row, a separator
     line between rows; a blocker turns its badge red and shows the fix beneath. */
  .checks {
    background: var(--surface-2); border: 1px solid var(--rule);
    border-radius: var(--radius-sm); padding: 0 .8rem;
  }
  .check {
    display: flex; gap: .6rem; align-items: flex-start; font-size: .82rem;
    padding: .6rem 0; border-bottom: 1px solid var(--rule);
  }
  .check:last-child { border-bottom: 0; }
  .check em {
    font-style: normal; flex: none; width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center; font-size: .6rem; margin-top: .05rem;
    background: var(--shipped); color: var(--accent-ink);
  }
  .check.no em { background: var(--accent); }
  .check > span { flex: 1; min-width: 0; }
  .check .fix { display: block; font-family: var(--mono); font-size: .7rem; color: var(--muted); margin-top: .2rem; }
  .ids { margin: .15rem 0 .1rem; }
  .ids summary {
    cursor: pointer; font-size: .72rem; color: var(--muted);
    list-style: none; width: max-content;
  }
  .ids summary::-webkit-details-marker { display: none; }
  .ids summary::before {
    content: "▸"; display: inline-block; margin-right: .35em;
    transition: transform 160ms var(--enter);
  }
  .ids[open] summary::before { transform: rotate(90deg); }
  .ids summary:hover { color: var(--ink); }
  .ids > div { font-family: var(--mono); font-size: .68rem; color: var(--muted); padding: .2rem 0 .1rem .8rem; }
  .check-note { font-size: .76rem; color: var(--muted); margin-top: .5rem; font-style: italic; }

  /* Each task is a solid card — only top-level rows (`> li`), so nested lists
     (acceptance criteria) stay plain. padding:0 removes the list indent so
     cards line up with the gate rail and section labels. */
  .tasks { list-style: none; display: grid; gap: .45rem; font-size: .8rem; margin: 0; padding: 0; }
  .tasks > li {
    display: flex; gap: .5rem; align-items: baseline; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--rule);
    border-radius: var(--radius-sm); padding: .6rem .8rem;
  }
  .tasks > li em { font-style: normal; flex: none; width: .9rem; }
  .tasks li.done { color: var(--ink); }
  .tasks li.done em { color: var(--shipped); }
  .tasks li.active em { color: var(--build); }
  .tasks li .id { font-family: var(--mono); font-size: .7rem; flex: none; }
  /* Fixed to the left (after the glyph), not floated right — consistent rows. */
  .task-state {
    flex: none; padding: .08rem .45rem; border: 1px solid var(--rule);
    border-radius: 999px; font: 600 .58rem/1.3 var(--mono); color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .task-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tasks li.active .task-state { color: var(--build); border-color: var(--build); }
  .tasks li.done .task-state { color: var(--shipped); border-color: var(--shipped); }

  /* A task opens onto its own dossier: what it was for, its slice of the plan,
     and what proves it ran. Closed by default — the list stays scannable. */
  .tasks li details { flex: 1; interpolate-size: allow-keywords; }
  .tasks li summary {
    display: flex; gap: .5rem; align-items: baseline; cursor: pointer;
    list-style: none; padding: .1rem 0;
  }
  .tasks li summary::-webkit-details-marker { display: none; }
  /* The native marker is replaced, not removed: a row that opens onto a
     dossier must not look identical to one that opens onto nothing, and
     hover is no affordance at all on the tablets this is read on. Same
     glyph and rotation as the next-steps disclosure above. */
  .tasks li summary::after {
    content: "▾"; margin-left: auto; padding-left: .5rem; flex: none;
    font-size: .7rem; display: inline-block; opacity: .5;
    transition: transform 180ms var(--enter), opacity 140ms ease-out;
  }
  /* currentColor, so the marker carries the same weight as its row rather
     than fading out on the done rows that are darkest. */
  .tasks li summary:hover::after,
  .tasks li details[open] summary::after { opacity: 1; }
  .tasks li details[open] summary::after { transform: rotate(180deg); }
  .tasks li summary:hover { color: var(--ink); }
  .tasks li details[open] summary { color: var(--ink); }
  .tasks li details > *:not(summary) { margin-left: 1.4rem; }
  /* Progressive enhancement: where ::details-content is supported the dossier
     unfolds at the same 180ms as the house .collapse pattern; elsewhere it
     simply appears, which is the behaviour today. */
  .tasks li details::details-content {
    block-size: 0; overflow: hidden;
    transition: block-size 180ms var(--enter), content-visibility 180ms allow-discrete;
  }
  .tasks li details[open]::details-content { block-size: auto; }
  .task-objective { margin: .5rem 0 .3rem; color: var(--ink); line-height: 1.5; }
  .task-ac h5, .task-plan h5, .task-proof h5, .task-focus h5 {
    font-family: var(--sans); font-size: .62rem; text-transform: uppercase;
    letter-spacing: .09em; color: var(--stone); margin: .7rem 0 .25rem; font-weight: 600;
  }
  .task-ac ul { list-style: none; display: grid; gap: .15rem; }
  .task-ac li { padding-left: .9rem; position: relative; line-height: 1.45; }
  .task-ac li::before { content: "◦"; position: absolute; left: 0; color: var(--stone); }
  .task-plan { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-sm); padding: .5rem .7rem; }
  .task-plan p { font-family: var(--serif); line-height: 1.55; margin: .2rem 0; }
  .task-proof div { line-height: 1.6; }
  .task-proof b {
    font-family: var(--sans); font-size: .62rem; text-transform: uppercase;
    letter-spacing: .07em; color: var(--stone); font-weight: 600; margin-right: .4rem;
  }
  .task-proof code { font-family: var(--mono); font-size: .68rem; color: var(--muted); }
  .task-proof .ran { color: var(--shipped); }
  .task-proof .unproven { color: var(--ready); }
  .task-focus p { line-height: 1.5; }

  .widen {
    margin-top: 1.4rem; font-size: .78rem; color: var(--accent); cursor: pointer;
    padding: .4rem 0; letter-spacing: .02em;
    transition: opacity 140ms ease-out, transform 110ms ease-out;
  }
  .widen:hover { opacity: .75; }
  .widen:active { transform: scale(.98); }

  /* Reading tabs — solid pills; the active one fills with the accent, raw json
     sits apart on the right. */
  .tabs { display: flex; gap: .35rem; align-items: center; margin-bottom: 1rem; }
  .tabs button {
    cursor: pointer; padding: .42rem .85rem; font-size: .68rem; border-radius: 999px;
    letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--rule);
    transition: color 140ms ease-out, background-color 140ms ease-out,
                border-color 140ms ease-out, transform 110ms ease-out;
  }
  .tabs button:hover { color: var(--ink); border-color: var(--muted); }
  .tabs button:active { transform: scale(.98); }
  .tabs button[aria-selected="true"] {
    color: var(--accent-ink); background: var(--accent); border-color: var(--accent);
  }
  .tabs .spacer { flex: 1; background: none; border: 0; padding: 0; }
  .tabs button.raw { text-transform: none; letter-spacing: .02em; }

  .filelink {
    display: inline-flex; align-items: center; gap: .4rem;
    font-family: var(--mono); font-size: .68rem; color: var(--muted); text-decoration: none;
    background: var(--surface-2); border: 1px solid var(--rule);
    padding: .32rem .65rem; border-radius: 999px; margin-bottom: 1rem;
    transition: color 140ms ease-out, border-color 140ms ease-out;
  }
  .filelink:hover { color: var(--accent); border-color: var(--accent); }

  /* markdown, typeset at a comfortable measure */
  .md { max-width: 34em; }
  /* In the drawer's reading panes the measure fills the (now half-width) panel
     instead of stopping at 34em and leaving the right half blank. */
  #drawer .md { max-width: none; }
  /* The wide reading pane (plan/spec prose) is a solid reading sheet. */
  .panel-body > .md {
    background: var(--surface-2); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 1.2rem 1.4rem;
  }
  .md > :first-child { margin-top: 0; }
  .md h1, .md h2, .md h3 { font-family: var(--serif); font-weight: 600; line-height: 1.25; margin: 1.3rem 0 .4rem; }
  .md h1 { font-size: 1.18rem; }
  .md h2 { font-size: 1.02rem; color: var(--accent); }
  .md h3 { font-size: .92rem; letter-spacing: 0; text-transform: none; color: var(--ink); border: 0; padding: 0; }
  .md p { font: .92rem/1.66 var(--serif); margin: .55rem 0; }
  /* Pointers: the marker sits in a fixed gutter and every wrapped line of the
     body flows UNDER the text — never back to the far-left margin. */
  .md ul, .md ol {
    font: .92rem/1.6 var(--serif); margin: .6rem 0; padding-left: 0;
    list-style: none; display: grid; gap: .42rem;
  }
  .md li { margin: 0; padding-left: 1.5rem; position: relative; }
  .md ul > li::before {
    content: ""; position: absolute; left: .3rem; top: .72em;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }
  .md ol { counter-reset: n; }
  .md ol > li { counter-increment: n; }
  .md ol > li::before {
    content: counter(n); position: absolute; left: 0; top: .12em;
    width: 1.2rem; height: 1.2rem; border-radius: 6px; text-align: center;
    font: 600 .66rem/1.2rem var(--mono); color: var(--accent); background: var(--tint);
  }
  .md strong { font-weight: 700; }
  .md em { font-style: italic; color: var(--muted); }
  .md blockquote {
    margin: .85rem 0; padding: .75rem .95rem; border: 1px solid var(--rule);
    background: var(--surface); border-radius: var(--radius-sm); color: var(--muted);
  }
  .md blockquote p:first-child { margin-top: 0; }
  .md blockquote p:last-child { margin-bottom: 0; }
  .md blockquote strong { color: var(--ink); }
  .md code { font-family: var(--mono); font-size: .76rem; background: var(--wash); padding: .05em .3em; border-radius: 4px; }
  .md pre {
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-sm);
    padding: .7rem .8rem; overflow-x: auto; margin: .7rem 0;
  }
  .md pre code { background: none; padding: 0; font-size: .72rem; line-height: 1.55; }

  /* Plan tables (every Surface Impact is one): ruled like a ledger, not boxed.
     The wrapper scrolls so a wide table never scrolls the page itself. */
  .tablewrap { overflow-x: auto; margin: .7rem 0; }
  .md table { border-collapse: collapse; width: 100%; font-size: .84rem; }
  .md th {
    font: 600 .62rem/1.3 var(--sans); text-transform: uppercase;
    letter-spacing: .09em; color: var(--stone); text-align: left;
    padding: 0 .8rem .35rem 0; border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  .md td {
    font-family: var(--serif); line-height: 1.5; vertical-align: baseline;
    padding: .42rem .8rem .42rem 0; border-bottom: 1px solid var(--rule);
    color: var(--muted);
  }
  .md tbody tr:last-child td { border-bottom: 0; }
  .md td.rowhead { color: var(--ink); white-space: nowrap; }
  .md td:last-child, .md th:last-child { padding-right: 0; }
  pre.raw {
    background: var(--surface-2); border: 1px solid var(--rule); border-radius: var(--radius-sm);
    padding: .7rem .8rem; overflow-x: auto; font-family: var(--mono); font-size: .7rem; line-height: 1.5;
  }

  /* One card, ruled like a table — a separator line under every row. */
  .kv {
    display: grid; grid-template-columns: max-content 1fr; gap: 0 1.2rem; font-size: .78rem;
    background: var(--surface-2); border: 1px solid var(--rule);
    border-radius: var(--radius-sm); padding: 0 .95rem;
  }
  .kv dt, .kv dd { padding: .5rem 0; border-bottom: 1px solid var(--rule); }
  .kv dt:last-of-type, .kv dd:last-of-type { border-bottom: 0; }
  .kv dt { color: var(--muted); font-family: var(--mono); font-size: .7rem; align-content: center; }
  .kv dd { margin: 0; align-content: center; }
  .verdict {
    display: inline-block; font: 600 .64rem/1.5 var(--mono);
    padding: .04rem .5rem; border-radius: 999px; border: 1px solid currentColor;
  }
  .verdict.ok { color: var(--shipped); }
  .verdict.bad { color: var(--accent); }
  .verdict.none { color: var(--muted); border-color: var(--rule); }
  .finding {
    border: 1px solid var(--rule); background: var(--surface-2); border-radius: var(--radius-sm);
    padding: .4rem .6rem; margin: .35rem 0; font-size: .76rem;
  }
  .finding.minor { color: var(--muted); }

  /* One ruled card — a separator line between rows, like the evidence table. */
  .ledger {
    display: grid; gap: 0; font-size: .8rem;
    background: var(--surface-2); border: 1px solid var(--rule);
    border-radius: var(--radius-sm); padding: 0 .8rem;
  }
  /* Aligned like a table: id column, title, status, then the file link pinned
     right — every row's columns line up. Long ids wrap and long paths
     ellipsize so a wide entry never overflows or squeezes the title. */
  .ledger > div {
    display: grid; grid-template-columns: minmax(6rem, 14rem) minmax(0, 1fr) max-content minmax(0, 13rem);
    gap: .25rem 1rem; align-items: baseline;
    padding: .6rem 0; border-bottom: 1px solid var(--rule);
  }
  .ledger > div:last-child { border-bottom: 0; }
  .ledger .id { font-family: var(--mono); font-size: .72rem; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .ledger .meta { color: var(--muted); font-size: .72rem; }
  .ledger .tag { font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); justify-self: start; }
  .ledger .filelink {
    grid-column: 4; justify-self: end; margin: 0; display: inline-block; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ledger .tag.draft { color: var(--ready); }
  .ledger .tag.confirmed { color: var(--shipped); }

  /* Decomposition task list — TASK · id · title, ruled like a table. The id
     column is sized to its content so ids never wrap character-by-character. */
  .dtasks {
    margin-top: .5rem; background: var(--surface-2); border: 1px solid var(--rule);
    border-radius: var(--radius-sm); padding: 0 .85rem;
  }
  .dtask {
    display: grid; grid-template-columns: max-content max-content minmax(0, 1fr);
    gap: .2rem .85rem; align-items: baseline; font-size: .8rem;
    padding: .6rem 0; border-bottom: 1px solid var(--rule);
  }
  .dtask:last-child { border-bottom: 0; }
  .dtask .id { font-family: var(--mono); font-size: .72rem; font-weight: 600; color: var(--ink); }
  .dtask .dtask-title { color: var(--muted); min-width: 0; }

  .quiet { color: var(--muted); font-size: .8rem; font-style: italic; }

  /* ── responsive ───────────────────────────────────────────────────── */
  @media (max-width: 900px) {
    .card-title { font-size: .7rem; }
    .lane-name { max-width: 55%; }
  }
  @media (max-width: 620px) {
    .overview-question { grid-template-columns: 1fr; gap: .7rem; }
    .project-sections { grid-template-columns: 1fr; }
    .story-position { grid-template-columns: 1fr; gap: .25rem; }
    .colhead > div { font-size: .56rem; letter-spacing: .06em; }
    .colhead .bn { font-size: 0; }
    .colhead .bn::before { content: "\25C6"; font-size: .6rem; }
    .card-title { display: none; }
    .rail { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem .4rem; }
  }

  /* ── motion budget ────────────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 1ms !important;
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }
</style>
