# Forge's settings. Your coding agent keeps this file: ask it to change a setting or upgrade Forge.
version = "v1.2.0"
repo = "client"
signoff = "docs/decisions/0034-client-signoff.md"
workers = "codex"
test = "npx --yes -p node@24 -- sh -c 'npm ci && (npm run format:check && npm run check:architecture && npm run lint:changed) && npm run typecheck && npm test'"
checks = ["ci", "tests", "forge-pr-check"]
interfaces = ["**/routes/**", "**/*.controller.*", "**/migrations/**", "**/schema.*", "**/*.schema.*", "**/cli.*"]

[models.build]
model = "gpt-6.1-sol"
effort = "medium"
subagents = "gpt-6-luna"
subagent_effort = "max"

[models.fix]
model = "gpt-6.1-sol"
effort = "medium"
subagents = "gpt-6-luna"
subagent_effort = "max"

[models.lite]
model = "gpt-6.1-sol"
effort = "medium"

[models.grill.codex]
model = "gpt-6.1-sol"
effort = "high"

[models.grill.claude]
model = "opus"
effort = "high"

[models.review]
model = "gpt-6.1-sol"
effort = "high"
